<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">DeadZone ROM Build Command Center</title><desc id="desc">Animated neon command center banner for DeadZone ROM builds</desc><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#020617"/><stop offset=".5" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient><linearGradient id="n" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f43f5e"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="360" rx="28" fill="url(#g)"/><g opacity=".22" stroke="#38bdf8"><path d="M0 60h1200M0 120h1200M0 180h1200M0 240h1200M0 300h1200"/><path d="M100 0v360M200 0v360M300 0v360M400 0v360M500 0v360M600 0v360M700 0v360M800 0v360M900 0v360M1000 0v360M1100 0v360"/></g><rect x="70" y="62" width="1060" height="236" rx="24" fill="none" stroke="url(#n)" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-dasharray" values="0 2200;2200 0;0 2200" dur="8s" repeatCount="indefinite"/></rect><text x="600" y="150" text-anchor="middle" fill="#f8fafc" font-family="Verdana,sans-serif" font-size="52" font-weight="700">DEADZONE ROM BUILD</text><text x="600" y="205" text-anchor="middle" fill="url(#n)" font-family="Verdana,sans-serif" font-size="31" font-weight="700">COMMAND CENTER</text><text x="600" y="248" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="20">BUILD • PATCH • PACKAGE • RELEASE</text><g fill="#22d3ee"><circle cx="160" cy="180" r="7"><animate attributeName="r" values="5;11;5" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="1040" cy="180" r="7"><animate attributeName="r" values="11;5;11" dur="1.8s" repeatCount="indefinite"/></circle></g><rect x="350" y="278" width="500" height="4" rx="2" fill="#1e293b"/><rect x="350" y="278" width="120" height="4" rx="2" fill="#22d3ee"><animate attributeName="x" values="350;730;350" dur="3s" repeatCount="indefinite"/></rect></svg>