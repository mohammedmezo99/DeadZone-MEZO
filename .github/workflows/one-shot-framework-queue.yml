name: One-shot Framework queue patch

on:
  push:
    paths:
      - .github/workflows/one-shot-framework-queue.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: install Framework queue patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD

      - name: Apply Framework queue contract
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/framework.yml')
          source = path.read_text(encoding='utf-8')
          old = "concurrency:\n  group: deadzone-framework-build-queue\n  cancel-in-progress: false"
          new = "concurrency:\n  group: deadzone-framework-build-queue\n  queue: max"
          if source.count(old) != 1:
              raise SystemExit('Framework concurrency block did not match exactly once')
          path.write_text(source.replace(old, new), encoding='utf-8')

      - name: Commit main
        run: |
          set -Eeuo pipefail
          git config user.name "DeadZone Queue Guard"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/framework.yml
          git diff --cached --check
          git commit -m "Queue Framework builds without cancellation"
          git push origin main
