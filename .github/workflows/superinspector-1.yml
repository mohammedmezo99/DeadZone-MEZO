name: MEZO-SuperInspector 1

run-name: "SuperInspector 1 - ${{ inputs.job_id }} - ${{ inputs.profile_id }}"

concurrency:
  group: mezo-superinspector-1
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "DeadZone Super Inspector job ID"
        required: true
        type: string
      rom_url:
        description: "HTTP(S) URL of the Xiaomi Fastboot ROM archive"
        required: true
        type: string
      original_filename:
        description: "Original ROM filename (optional)"
        required: false
        type: string
        default: ""
      inspector_ref:
        description: "Pinned DeadZone-SuperInspector commit SHA"
        required: true
        type: string
      target_repo:
        description: "Repository slug that owns this run"
        required: true
        type: string
      profile_id:
        description: "Pre-allocated 16-hex profile ID (idempotency key)"
        required: true
        type: string
      callback_url:
        description: "Signed DeadZone callback URL"
        required: true
        type: string
      max_rom_bytes:
        description: "Hard cap for ROM download"
        required: false
        type: number
        default: 4294967296

permissions:
  # The reusable workflow superinspector-core.yml declares
  # {permissions: contents: write} at the workflow level. When a
  # caller does {uses: ./.../superinspector-core.yml}, GitHub
  # Actions enforces that the caller's granted scope is at least
  # as broad as the callee's declared scope. Otherwise the file
  # is rejected at parse time with HTTP 422 / "Invalid workflow
  # file" + "The workflow '...' is requesting 'contents: write',
  # but is only allowed 'contents: read'." Declaring {contents:
  # write} here lets the GITHUB_TOKEN inherited via
  # {secrets: inherit} perform the publish step.
  contents: write

jobs:
  superinspector:
    name: "SuperInspector Worker 1"
    uses: ./.github/workflows/superinspector-core.yml
    with:
      job_id: ${{ inputs.job_id }}
      rom_url: ${{ inputs.rom_url }}
      original_filename: ${{ inputs.original_filename }}
      inspector_ref: ${{ inputs.inspector_ref }}
      target_repo: ${{ inputs.target_repo }}
      profile_id: ${{ inputs.profile_id }}
      callback_url: ${{ inputs.callback_url }}
      max_rom_bytes: ${{ inputs.max_rom_bytes | int }}
    secrets: inherit
