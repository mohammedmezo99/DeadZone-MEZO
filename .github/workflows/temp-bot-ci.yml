name: Temporary Bot CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-bot-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout DeadZone Bot
        uses: actions/checkout@v4
        with:
          repository: mohammedmezo99/DeadZone-Bot
          ref: 7361bb6013ef4fb888462b5e38b8b530052d644a
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install project metadata
        working-directory: cloudflare
        run: npm ci

      - name: Secret audit
        working-directory: cloudflare
        run: npm run security:audit

      - name: Typecheck
        working-directory: cloudflare
        run: npm run typecheck

      - name: Test
        working-directory: cloudflare
        run: npm test

      - name: Verify production workflow contracts
        working-directory: cloudflare
        run: npm run workflows:audit

      - name: Apply D1 migrations locally
        working-directory: cloudflare
        run: npm run d1:local

      - name: Validate Worker bundle
        working-directory: cloudflare
        run: npm run deploy:dry-run
