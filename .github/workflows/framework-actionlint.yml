name: Validate Framework Workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/framework-actionlint.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install actionlint
        run: |
          set -Eeuo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Validate Framework workflow
        run: ./actionlint -color .github/workflows/framework.yml

# syntax validation trigger
