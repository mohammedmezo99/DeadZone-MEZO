name: Validate Framework Workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/framework-actionlint.yml'
      - 'tools/fix_framework_yaml_printf.py'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Generate syntax-fixed candidate
        run: python3 tools/fix_framework_yaml_printf.py
      - name: Install actionlint
        run: |
          set -Eeuo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Validate Framework candidate
        run: ./actionlint -color -ignore 'SC2129' framework.syntax-fixed.yml
      - name: Publish validated candidate
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add framework.syntax-fixed.yml
          git commit -m "build: stage validated Framework syntax candidate"
          git push origin HEAD:main
