name: Persist DeadZone Release Posters

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/persist-deadzone-posters.yml'

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout launcher
        uses: actions/checkout@v5

      - name: Download verified poster previews
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import Request, urlopen

          assets = {
              "lite.png": "https://media.canva.com/v2/document-image/hash:-1082642032/height:335/id:DAHRofJDLoY/type:B/width:595?brand=BAHDvCBCsnA&csig=AAAAAAAAAAAAAAAAAAAAAFOvL8py95SWdaflz27pgfiYbDcGxh7lq37XtesjtU4_&disableexport=T&exp=1786128112&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export-us1.canva.com%2FJDLoY%2FDAHRofJDLoY%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHXB3PK6CC%252F20260806%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260806T201631Z%26X-Amz-Expires%3D80721%26X-Amz-Signature%3D902cc2228b8259412eff7aef2870f5d60f3c5b77c54cfa46e8392fcf675e59e3%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DFri%252C%252007%2520Aug%25202026%252018%253A41%253A52%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAPF6bvmTKMd039oxSQk7e8zrI15SCs6gAdO-zCgnniaL&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1",
              "gamingplus.png": "https://media.canva.com/v2/document-image/hash:-809722580/height:335/id:DAHRoRm54M4/type:B/width:596?brand=BAHDvCBCsnA&csig=AAAAAAAAAAAAAAAAAAAAAAPW3NAGiRdZqf-EZMf7x_6vGmdgHM3MVayknABsk3rp&disableexport=T&exp=1786128165&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export-us1.canva.com%2Fm54M4%2FDAHRoRm54M4%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHXB3PK6CC%252F20260807%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260807T033458Z%26X-Amz-Expires%3D54467%26X-Amz-Signature%3D8972f63034a4043f467be230248423ac0f085a40b9631b6ba5ad6253b15467b6%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DFri%252C%252007%2520Aug%25202026%252018%253A42%253A45%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAKQJlJMRUfrA09Wg_9LNe6q48PrP_-HF_kQ2jOpBtfzu&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1",
              "module.png": "https://media.canva.com/v2/document-image/hash:368673620/height:335/id:DAHRoa4A6Tk/type:B/width:595?brand=BAHDvCBCsnA&csig=AAAAAAAAAAAAAAAAAAAAADnvtUlifuDlG2JfXgv22JtsT-3lAB0Cg_qz9-gyHhR7&disableexport=T&exp=1786128201&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export-us1.canva.com%2F4A6Tk%2FDAHRoa4A6Tk%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHXB3PK6CC%252F20260806%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260806T224300Z%26X-Amz-Expires%3D72021%26X-Amz-Signature%3Da34ec7f9d28a245cd4964fb7ab8fe81d3ff97e44b26c14d49b12dcc4bfe13aec%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DFri%252C%252007%2520Aug%25202026%252018%253A43%253A21%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAG1Cpbb71H58DZ2MqSHE6lvj_zL3B7UZMDS1l_YhWJSs&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1",
              "port.png": "https://media.canva.com/v2/document-image/hash:1824409137/height:335/id:DAHRobQJP7w/type:B/width:595?brand=BAHDvCBCsnA&csig=AAAAAAAAAAAAAAAAAAAAAIVwxkBEtU5wnqnKQ7GMcYuLY8NPMrvfKZdP_BP-gJyw&disableexport=T&exp=1786128222&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export-us1.canva.com%2FQJP7w%2FDAHRobQJP7w%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHXB3PK6CC%252F20260806%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260806T183256Z%26X-Amz-Expires%3D87046%26X-Amz-Signature%3D744151498418d36a495af1be3c9af4dbbec103c770096c0545cd6745b8846139%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DFri%252C%252007%2520Aug%25202026%252018%253A43%253A42%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAKGBSARo-pwynOUUDI1fe6fIewoAq4RbSClZXUcG_FZS&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1",
              "ninja.png": "https://media.canva.com/v2/document-image/hash:381701189/height:335/id:DAHRoQp-fO8/type:B/width:595?brand=BAHDvCBCsnA&csig=AAAAAAAAAAAAAAAAAAAAAGiEHbvfo7MdZIlIddfULC8yPJBAaoXuFmfGW0ggGPjo&disableexport=T&exp=1786128248&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export-us1.canva.com%2Fp-fO8%2FDAHRoQp-fO8%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHXB3PK6CC%252F20260807%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260807T032914Z%26X-Amz-Expires%3D54894%26X-Amz-Signature%3Da625b522795fd5085a0eca1950b3c5692a56f4ab3f2a11269fa9508a881be4f8%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DFri%252C%252007%2520Aug%25202026%252018%253A44%253A08%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAALOm2LW7BcPA6x9YgTGuYGaSvxVF1PxDp99H5FncoG7n&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1",
              "legend.jpg": "https://media.canva.com/v2/image-resize/format:JPG/height:112/quality:75/uri:ifs%3A%2F%2FM%2F7155e4f9-e9ef-4d47-a19e-e64703dc840e/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAGy3xtUiroGd6Zjy70ob0X2WwmQBR1A_yvJjcDVMWRbJ&exp=1786139247&osig=AAAAAAAAAAAAAAAAAAAAAK3UkgqRt4idYck69Wopiem3onOoN9X5VBVn04xqoVpm&signer=media-rpc&x-canva-quality=thumbnail",
          }

          out = Path("assets/posters")
          out.mkdir(parents=True, exist_ok=True)
          for name, url in assets.items():
              request = Request(url, headers={"User-Agent": "DeadZone-Poster-Persist/1.0"})
              with urlopen(request, timeout=45) as response:
                  data = response.read()
                  content_type = response.headers.get("content-type", "")
              if len(data) < 5000:
                  raise SystemExit(f"Poster too small: {name} ({len(data)} bytes)")
              if not (data.startswith(b"\x89PNG\r\n\x1a\n") or data.startswith(b"\xff\xd8\xff")):
                  raise SystemExit(f"Poster is not PNG/JPEG: {name} ({content_type})")
              (out / name).write_bytes(data)
              print(f"{name}: {len(data)} bytes ({content_type})")

      - name: Validate media files
        run: |
          set -euo pipefail
          test "$(find assets/posters -maxdepth 1 -type f | wc -l)" -eq 6
          file assets/posters/*
          for poster in assets/posters/*; do
            test -s "$poster"
          done

      - name: Commit public release posters
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/posters
          git commit -m "feat: add DeadZone project release posters"
          git push origin HEAD:main
