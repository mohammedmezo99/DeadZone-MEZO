name: Temporary Finish Port Conversion

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-finish-port-conversion.yml"

permissions:
  contents: read

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: 6bd3bd08c4b0f071ddf051ba71e76468a2415325
    steps:
      - name: Checkout Port target
        uses: actions/checkout@v4
        with:
          repository: mohammedmezo99/DeadZone-xiaomi_Port
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: target
          fetch-depth: 1

      - name: Guard target head
        working-directory: target
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Finish Port identity and runtime
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p bin/port

          cp -f uploadROM.sh bin/port/uploadROM.sh
          python3 - <<'PY'
          from pathlib import Path

          path = Path('bin/port/uploadROM.sh')
          text = path.read_text()
          changes = (
              ('Missing Lite runtime state', 'Missing Port runtime state'),
              ('DeadZone_Lite_V${version_number}_', 'DeadZone_Port_V${version_number}_'),
              ('Final Lite ZIP was not created', 'Final Port ZIP was not created'),
              ('Final Lite ZIP failed integrity validation', 'Final Port ZIP failed integrity validation'),
              ('${RCLONE_UPLOAD_DIR%/}/Lite/${codename_upper}/${os_folder}/${final_name}', '${RCLONE_UPLOAD_DIR%/}/Port/${codename_upper}/${os_folder}/${final_name}'),
          )
          for old, new in changes:
              if old not in text:
                  raise SystemExit(f'upload anchor missing: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

          cat > uploadROM.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          repo_root="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$repo_root"
          exec bash "$repo_root/bin/port/uploadROM.sh" "$@"
          SH

          cat > setup.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
              aria2 p7zip-full zip unzip rclone python3 python3-pip zstd bc \
              xmlstarlet aapt zipalign android-sdk-libsparse-utils erofs-utils brotli
          chmod -R u+rwX,go+rX bin
          SH

          python3 - <<'PY'
          from pathlib import Path

          path = Path('notify.py')
          text = path.read_text()
          changes = (
              ('Applying DeadZone Lite modifications', 'Applying DeadZone Port modifications'),
              ('r"lite_[A-Za-z0-9]{8,80}"', 'r"port_[A-Za-z0-9]{8,80}"'),
              ('"project": "lite"', '"project": "port"'),
              ('"User-Agent": "DeadZone-xiaomi-Lite"', '"User-Agent": "DeadZone-xiaomi-Port"'),
          )
          for old, new in changes:
              if old not in text:
                  raise SystemExit(f'notify anchor missing: {old}')
              text = text.replace(old, new)

          marker = '\n\ndef _rom_properties() -> dict[str, str]:\n'
          if marker not in text:
              raise SystemExit('notify metadata marker missing')
          helper = '''\n\ndef _port_release_metadata() -> dict[str, str]:\n    state_root = Path("build/.port_state")\n    fields: dict[str, str] = {}\n    for role in ("stock", "port"):\n        root = state_root / role / "ddevice"\n        mapping = {\n            f"{role}_device_name": root / "name_devices.txt",\n            f"{role}_codename": root / "device_f.txt",\n            f"{role}_rom_version": root / "base_rom_code.txt",\n            f"{role}_android_version": root / "androidver.txt",\n        }\n        for field, value_path in mapping.items():\n            value = _read_first(str(value_path))\n            if value:\n                fields[field] = value[:120]\n        region = _normalized_region(_read_first(str(root / "device_type.txt")))\n        if region:\n            fields[f"{role}_region"] = region[:100]\n    return fields\n'''
          text = text.replace(marker, helper + marker, 1)
          anchor = '        **_release_metadata(),\n'
          if anchor not in text:
              raise SystemExit('notify payload marker missing')
          text = text.replace(anchor, anchor + '        **_port_release_metadata(),\n', 1)
          path.write_text(text)
          PY

          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.MD')
          text = path.read_text(errors='replace')
          for old, new in (
              ('DeadZone-xiaomi_Lite', 'DeadZone-xiaomi_Port'),
              ('DeadZone-xiaomi-Lite', 'DeadZone-xiaomi-Port'),
              ('DeadZone_Lite', 'DeadZone_Port'),
              ('DeadZone Lite', 'DeadZone Port'),
          ):
              text = text.replace(old, new)
          path.write_text(text)
          PY

          chmod +x build.sh setup.sh uploadROM.sh bin/port/merge.sh bin/port/uploadROM.sh

      - name: Validate before push
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n build.sh
          bash -n setup.sh
          bash -n uploadROM.sh
          bash -n bin/port/merge.sh
          bash -n bin/port/uploadROM.sh
          python3 -m py_compile notify.py
          grep -Fq 'DeadZone_Port_V${version_number}_${codename_upper}_${rom_version_component}_${region_component}-A${android_digits}.zip' bin/port/uploadROM.sh
          grep -Fq '${RCLONE_UPLOAD_DIR%/}/Port/${codename_upper}/${os_folder}/${final_name}' bin/port/uploadROM.sh
          grep -Fq 'r"port_[A-Za-z0-9]{8,80}"' notify.py
          grep -Fq '"project": "port"' notify.py
          grep -Fq 'stock_device_name' notify.py
          grep -Fq 'port_device_name' notify.py
          rm -rf __pycache__
          git diff --check -- build.sh notify.py uploadROM.sh setup.sh bin/port/merge.sh bin/port/uploadROM.sh README.MD

      - name: Commit directly to Port main
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- notify.py uploadROM.sh setup.sh bin/port/uploadROM.sh README.MD build.sh bin/port/merge.sh
          git diff --cached --stat
          git commit -m "port: wire Port identity upload and telemetry"
          git push origin HEAD:main

      - name: Verify remote main
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth=1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/mohammedmezo99/DeadZone-xiaomi_Port.git" verify
          cd verify
          bash -n build.sh
          bash -n bin/port/merge.sh
          bash -n bin/port/uploadROM.sh
          python3 -m py_compile notify.py
          grep -Fq 'DeadZone_Port_V${version_number}_' bin/port/uploadROM.sh
          grep -Fq '"project": "port"' notify.py
          echo "Port identity verification passed"
