name: DeadZone_exe

run-name: 📦 DeadZone_exe 3-platform build · ${{ github.ref_name }} · ${{ github.run_id }}

concurrency:
  group: deadzone-exe-build-queue
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deadzone-exe.yml

permissions:
  contents: read

jobs:
  resolve:
    name: 🧭 Resolve EXE engine
    runs-on: ubuntu-latest
    outputs:
      engine_repository: ${{ steps.engine.outputs.repository }}
      engine_sha: ${{ steps.pin.outputs.sha }}

    steps:
      - name: 🔐 Validate launcher credential
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || {
            echo "::error::Missing shared launcher credential: GH_TOKEN"
            exit 1
          }

      - name: 🔒 Checkout central DeadZone repository map
        uses: actions/checkout@v5
        with:
          repository: mohammedmezo99/DeadZone-File
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: runtime
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: projects.env
          sparse-checkout-cone-mode: false

      - name: 🧩 Resolve DeadZone_EXE repository
        id: engine
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          mapping = {}
          for raw_line in Path("runtime/projects.env").read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, mapped_repository = line.split("=", 1)
              mapping[key.strip()] = mapped_repository.strip()

          repository = mapping.get("EXE_REPOSITORY", "")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              raise SystemExit("EXE_REPOSITORY is missing or invalid in central projects.env")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"repository={repository}\n")

          print(f"DeadZone EXE engine: {repository}")

      - name: 📌 Pin DeadZone_EXE main revision
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.engine.outputs.repository }}
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: engine-pin
          fetch-depth: 1
          persist-credentials: false

      - name: 🔒 Export pinned engine SHA
        id: pin
        shell: bash
        run: |
          set -Eeuo pipefail
          sha="$(git -C engine-pin rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Unable to pin DeadZone_EXE revision"
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinned DeadZone_EXE: $sha"

  build:
    name: 🏗️ ${{ matrix.artifact_name }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: DeadZone-Windows
            runtime_name: windows
            fastboot_name: fastboot.exe
            platform_tools_urls: >-
              https://dl.google.com/android/repository/platform-tools-latest-windows.zip
              https://dl-ssl.google.com/android/repository/platform-tools-latest-windows.zip
          - os: ubuntu-latest
            artifact_name: DeadZone-Linux
            runtime_name: linux
            fastboot_name: fastboot
            platform_tools_urls: >-
              https://dl.google.com/android/repository/platform-tools-latest-linux.zip
          - os: macos-latest
            artifact_name: DeadZone-macOS-arm64
            runtime_name: macos-arm64
            fastboot_name: fastboot
            platform_tools_urls: >-
              https://dl.google.com/android/repository/platform-tools-latest-darwin.zip

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout pinned DeadZone_EXE
        uses: actions/checkout@v5
        with:
          repository: ${{ needs.resolve.outputs.engine_repository }}
          ref: ${{ needs.resolve.outputs.engine_sha }}
          token: ${{ secrets.GH_TOKEN }}
          path: engine
          fetch-depth: 1
          persist-credentials: false

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install build dependencies
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 🐧 Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 libegl1 libxkbcommon0

      - name: 🧪 Compile engine
        working-directory: engine
        run: python -m compileall -q app.py build.py core ui

      - name: ⚡ Prepare Fastboot runtime
        working-directory: engine
        shell: python
        env:
          PLATFORM_TOOLS_URLS: ${{ matrix.platform_tools_urls }}
          RUNTIME_NAME: ${{ matrix.runtime_name }}
          FASTBOOT_NAME: ${{ matrix.fastboot_name }}
        run: |
          import os
          import shutil
          import time
          import urllib.error
          import urllib.request
          import zipfile
          from pathlib import Path

          urls = os.environ["PLATFORM_TOOLS_URLS"].split()
          runtime_name = os.environ["RUNTIME_NAME"]
          fastboot_name = os.environ["FASTBOOT_NAME"]
          archive_path = Path("platform-tools.zip")

          def download(url):
              for attempt in range(1, 4):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": "DeadZone-exe-Launcher"},
                      )
                      with urllib.request.urlopen(request, timeout=60) as response:
                          with archive_path.open("wb") as output:
                              shutil.copyfileobj(response, output)
                      if archive_path.stat().st_size > 0:
                          return True
                  except (OSError, urllib.error.URLError) as error:
                      print(f"Download attempt {attempt} failed for {url}: {error}")
                      archive_path.unlink(missing_ok=True)
                      if attempt < 3:
                          time.sleep(5 * attempt)
              return False

          if not any(download(url) for url in urls):
              raise SystemExit("Unable to download Android platform-tools")

          required = [f"platform-tools/{fastboot_name}"]
          if runtime_name == "windows":
              required.extend(
                  (
                      "platform-tools/AdbWinApi.dll",
                      "platform-tools/AdbWinUsbApi.dll",
                  )
              )

          destination = Path("platform-tools")
          shutil.rmtree(destination, ignore_errors=True)
          destination.mkdir(parents=True)

          with zipfile.ZipFile(archive_path) as archive:
              available = set(archive.namelist())
              missing = [member for member in required if member not in available]
              if missing:
                  raise SystemExit(
                      "Android platform-tools archive is missing: " + ", ".join(missing)
                  )
              for member in required:
                  target = destination / Path(member).name
                  with archive.open(member) as source, target.open("wb") as output:
                      shutil.copyfileobj(source, output)

          archive_path.unlink(missing_ok=True)

      - name: 🏗️ Build clean executable
        working-directory: engine
        run: python build.py --clean --onefile

      - name: 📂 Stage external Fastboot runtime
        working-directory: engine
        shell: python
        env:
          RUNTIME_NAME: ${{ matrix.runtime_name }}
          FASTBOOT_NAME: ${{ matrix.fastboot_name }}
        run: |
          import os
          import shutil
          import stat
          from pathlib import Path

          runtime_name = os.environ["RUNTIME_NAME"]
          fastboot_name = os.environ["FASTBOOT_NAME"]
          source = Path("platform-tools")
          destination = Path("dist/META-INF/DeadZone/runtime") / runtime_name
          destination.mkdir(parents=True, exist_ok=True)

          runtime_files = [fastboot_name]
          if runtime_name == "windows":
              runtime_files.extend(("AdbWinApi.dll", "AdbWinUsbApi.dll"))

          for filename in runtime_files:
              target = destination / filename
              shutil.copy2(source / filename, target)
              if runtime_name != "windows":
                  target.chmod(
                      target.stat().st_mode
                      | stat.S_IXUSR
                      | stat.S_IXGRP
                      | stat.S_IXOTH
                  )

          config = Path("config.json")
          if config.is_file():
              shutil.copy2(config, Path("dist/config.json"))

      - name: 🍎 Prune duplicate macOS launcher
        if: runner.os == 'macOS'
        working-directory: engine
        shell: bash
        run: |
          set -Eeuo pipefail
          app_binary="dist/DeadZone.app/Contents/MacOS/DeadZone"
          standalone="dist/DeadZone"
          [[ -f "$app_binary" ]] || {
            echo "::error::Missing macOS app launcher: $app_binary"
            exit 1
          }
          [[ -f "$standalone" ]] || {
            echo "::error::Missing duplicate macOS standalone launcher: $standalone"
            exit 1
          }
          rm -f "$standalone"
          echo "Removed duplicate macOS standalone launcher; DeadZone.app remains packaged."

      - name: ⚡ Verify packaged Fastboot
        working-directory: engine
        shell: python
        env:
          RUNTIME_NAME: ${{ matrix.runtime_name }}
          FASTBOOT_NAME: ${{ matrix.fastboot_name }}
        run: |
          import os
          import subprocess
          from pathlib import Path

          fastboot = (
              Path("dist/META-INF/DeadZone/runtime")
              / os.environ["RUNTIME_NAME"]
              / os.environ["FASTBOOT_NAME"]
          )
          completed = subprocess.run(
              [str(fastboot.resolve()), "--version"],
              check=False,
              capture_output=True,
              text=True,
          )
          print(completed.stdout or completed.stderr)
          if completed.returncode != 0:
              raise SystemExit("Packaged Fastboot runtime failed its version check")

      - name: 🪟 Launch and verify real DeadZone window
        if: runner.os == 'Windows'
        working-directory: engine
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/DeadZone.exe"
          $localLog = Join-Path (Split-Path $exe) "DeadZone-crash.log"
          $tempLog = Join-Path $env:TEMP "DeadZone-crash.log"
          $nativeLog = Join-Path (Split-Path $exe) "DeadZone-native-crash.txt"
          Remove-Item $localLog, $tempLog, $nativeLog -Force -ErrorAction SilentlyContinue
          $startedAt = Get-Date

          function Write-NativeDiagnostics([string]$Reason) {
            $Reason | Tee-Object -FilePath $nativeLog
            if (Test-Path $localLog) {
              "--- DeadZone-crash.log ---" | Tee-Object -FilePath $nativeLog -Append
              Get-Content $localLog | Tee-Object -FilePath $nativeLog -Append
            }
            if (Test-Path $tempLog) {
              "--- TEMP DeadZone-crash.log ---" | Tee-Object -FilePath $nativeLog -Append
              Get-Content $tempLog | Tee-Object -FilePath $nativeLog -Append
            }
            Start-Sleep -Seconds 2
            $events = Get-WinEvent -FilterHashtable @{ LogName='Application'; StartTime=$startedAt } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'DeadZone\.exe|Qt6|qfluent|python312' } |
              Select-Object -First 20 TimeCreated, Id, ProviderName, LevelDisplayName, Message
            if ($events) {
              $events | Format-List | Out-String | Tee-Object -FilePath $nativeLog -Append
              $events | Format-List
            } else {
              "No matching Application event was recorded." | Tee-Object -FilePath $nativeLog -Append
            }
          }

          $rootProcess = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddSeconds(45)
          $windowProcess = $null

          while ((Get-Date) -lt $deadline) {
            $rootProcess.Refresh()
            $candidates = @(Get-Process -Name "DeadZone" -ErrorAction SilentlyContinue)
            $windowProcess = $candidates |
              Where-Object { $_.MainWindowHandle -ne 0 } |
              Select-Object -First 1

            if ($windowProcess) {
              break
            }

            if ($rootProcess.HasExited -and $candidates.Count -eq 0) {
              Write-NativeDiagnostics "DeadZone.exe exited before creating a native window. Exit code: $($rootProcess.ExitCode)"
              throw "DeadZone.exe exited before its window opened."
            }

            Start-Sleep -Milliseconds 500
          }

          if (-not $windowProcess) {
            Write-NativeDiagnostics "DeadZone.exe did not create a native main window within 45 seconds."
            Get-Process -Name "DeadZone" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            throw "DeadZone.exe stayed headless for 45 seconds."
          }

          Write-Host "DeadZone native window detected: PID=$($windowProcess.Id) HWND=$($windowProcess.MainWindowHandle)"
          Start-Sleep -Seconds 5
          $windowProcess.Refresh()
          if ($windowProcess.HasExited) {
            Write-NativeDiagnostics "DeadZone window process exited immediately after its window appeared."
            throw "DeadZone.exe window was not stable after startup."
          }

          Get-Process -Name "DeadZone" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "DeadZone.exe opened a real native window and remained stable for 5 seconds: PASS"

      - name: 📤 Upload Windows startup diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DeadZone-Windows-Failed-Diagnostics
          path: |
            engine/dist/DeadZone-native-crash.txt
            engine/dist/DeadZone-crash.log
          if-no-files-found: warn
          retention-days: 30

      - name: 📏 Report package size
        if: success()
        working-directory: engine
        shell: python
        run: |
          from pathlib import Path

          files = [path for path in Path("dist").rglob("*") if path.is_file()]
          total = sum(path.stat().st_size for path in files)
          print(
              f"DeadZone package: {total / 1024 / 1024:.1f} MiB "
              f"across {len(files)} files"
          )
          for path in sorted(files):
              print(
                  f"  {path.relative_to('dist')}: "
                  f"{path.stat().st_size / 1024 / 1024:.1f} MiB"
              )

      - name: 📤 Upload platform build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: engine/dist/
          if-no-files-found: error
          retention-days: 30
