name: Framework Credential Preflight

on:
  push:
    paths:
      - .github/workflows/framework-access-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Verify Framework engine access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check shared GH_TOKEN
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ENGINE_REPOSITORY: mohammedmezo99/DeadZone-xiaomi_FrameworkPatcher
        run: |
          set -Eeuo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo "::error::GH_TOKEN is missing"; exit 1; }
          status="$(
            curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${ENGINE_REPOSITORY}/contents/?ref=main"
          )"
          [[ "$status" == "200" ]] || {
            echo "::error::Shared GH_TOKEN cannot read FrameworkPatcher (HTTP ${status})"
            exit 1
          }
          echo "SHARED_FRAMEWORK_ACCESS=OK"
