name: Temporary Copy Disable Signature Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-copy-disable-signature-verification.yml"

permissions:
  contents: read

jobs:
  copy-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source xiaomi_Lite
        uses: actions/checkout@v4
        with:
          repository: mohammedmezo99/xiaomi_Lite
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout target DeadZone-xiaomi_Lite
        uses: actions/checkout@v4
        with:
          repository: mohammedmezo99/DeadZone-xiaomi_Lite
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: target
          fetch-depth: 1

      - name: Copy mod exactly
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC="$GITHUB_WORKSPACE/source/mods/Package/Disable Signature Verification"
          DST="$GITHUB_WORKSPACE/target/bin/package/Disable Signature Verification"

          test -d "$SRC"
          rm -rf "$DST"
          mkdir -p "$(dirname "$DST")"
          cp -a "$SRC" "$DST"

      - name: Verify byte-for-byte copy
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import stat
          from pathlib import Path

          src = Path("source/mods/Package/Disable Signature Verification")
          dst = Path("target/bin/package/Disable Signature Verification")

          def digest(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def snapshot(root: Path):
              result = {}
              for base, dirs, files in os.walk(root, topdown=True, followlinks=False):
                  base_path = Path(base)
                  names = sorted(dirs + files)
                  for name in names:
                      path = base_path / name
                      rel = path.relative_to(root).as_posix()
                      st = path.lstat()
                      mode = stat.S_IMODE(st.st_mode)
                      if path.is_symlink():
                          result[rel] = ("symlink", mode, os.readlink(path))
                      elif path.is_dir():
                          result[rel] = ("dir", mode)
                      elif path.is_file():
                          result[rel] = ("file", mode, st.st_size, digest(path))
                      else:
                          result[rel] = ("other", mode, st.st_size)
              return result

          source_snapshot = snapshot(src)
          target_snapshot = snapshot(dst)
          if source_snapshot != target_snapshot:
              source_keys = set(source_snapshot)
              target_keys = set(target_snapshot)
              print("Missing in target:", sorted(source_keys - target_keys))
              print("Extra in target:", sorted(target_keys - source_keys))
              for key in sorted(source_keys & target_keys):
                  if source_snapshot[key] != target_snapshot[key]:
                      print("Mismatch:", key, source_snapshot[key], target_snapshot[key])
              raise SystemExit("Exact-copy verification failed")

          files = sum(1 for value in source_snapshot.values() if value[0] == "file")
          dirs = sum(1 for value in source_snapshot.values() if value[0] == "dir")
          links = sum(1 for value in source_snapshot.values() if value[0] == "symlink")
          print(f"Verified exact copy: {files} files, {dirs} directories, {links} symlinks")
          PY

      - name: Commit only copied mod to target main
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "bin/package/Disable Signature Verification"

          if git diff --cached --quiet; then
            echo "Destination is already byte-identical to source."
            exit 0
          fi

          echo "Files staged for exact transfer:"
          git diff --cached --name-status -- "bin/package/Disable Signature Verification"
          git commit -m "package: add Disable Signature Verification mod"
          git push origin HEAD:main
          echo "TARGET_COMMIT=$(git rev-parse HEAD)"

      - name: Verify target repository after push
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf verify-target
          git clone --depth=1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/mohammedmezo99/DeadZone-xiaomi_Lite.git" verify-target >/dev/null 2>&1
          python3 - <<'PY'
          import hashlib
          import os
          import stat
          from pathlib import Path

          src = Path("source/mods/Package/Disable Signature Verification")
          dst = Path("verify-target/bin/package/Disable Signature Verification")

          def digest(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def snapshot(root: Path):
              result = {}
              for base, dirs, files in os.walk(root, topdown=True, followlinks=False):
                  base_path = Path(base)
                  for name in sorted(dirs + files):
                      path = base_path / name
                      rel = path.relative_to(root).as_posix()
                      st = path.lstat()
                      mode = stat.S_IMODE(st.st_mode)
                      if path.is_symlink():
                          result[rel] = ("symlink", mode, os.readlink(path))
                      elif path.is_dir():
                          result[rel] = ("dir", mode)
                      elif path.is_file():
                          result[rel] = ("file", mode, st.st_size, digest(path))
                      else:
                          result[rel] = ("other", mode, st.st_size)
              return result

          if snapshot(src) != snapshot(dst):
              raise SystemExit("Post-push repository verification failed")
          print("Post-push verification passed: target main is exactly identical to source mod.")
          PY
