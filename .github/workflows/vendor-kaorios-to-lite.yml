name: Vendor Kaorios To Lite

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vendor-kaorios-to-lite.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor:
    name: 📦 Vendor Kaorios locally
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_REPO: mohammedmezo99/DeadZone-xiaomi_Lite
      TARGET_BRANCH: main
      KAORIOS_VERSION: V2.0.3
      CLASSES_NAME: classes_V2.0.3.9-2.dex
      MODULE_NAME: ModuleTemplate_V2.0.3.9-2.zip
      XML_NAME: com.kousei.kaorios.xml
      CLASSES_SHA256: f73df101b93d3485ebc0d80be1d5c6d221721cac8bee4db0c7dfe731365b657a
      MODULE_SHA256: 2ef38580aa03f441fa89d2e71c80d5d65dfd0705f58f19d223fb3856636bed7d
      XML_SHA256: 7360944ed2549c4cc9f205fa8fdfccb8f891fd7f80fd6674dbca497186ddc099

    steps:
      - name: 🔐 Validate target token
        shell: bash
        env:
          TARGET_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${TARGET_TOKEN:-}" || {
            echo '::error::GH_TOKEN secret is missing'
            exit 1
          }

      - name: 📥 Checkout Lite engine
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.GH_TOKEN }}
          path: lite
          fetch-depth: 1
          persist-credentials: true

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 📦 Download and vendor pinned Kaorios assets
        shell: bash
        run: |
          set -Eeuo pipefail

          release_base="https://github.com/Wuang26/Kaorios-Toolbox/releases/download/${KAORIOS_VERSION}"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          curl --fail --location --retry 3 --retry-delay 2 \
            "${release_base}/${CLASSES_NAME}" -o "$temp_dir/$CLASSES_NAME"
          curl --fail --location --retry 3 --retry-delay 2 \
            "${release_base}/${MODULE_NAME}" -o "$temp_dir/$MODULE_NAME"
          curl --fail --location --retry 3 --retry-delay 2 \
            "${release_base}/${XML_NAME}" -o "$temp_dir/$XML_NAME"

          printf '%s  %s\n' "$CLASSES_SHA256" "$temp_dir/$CLASSES_NAME" | sha256sum -c -
          printf '%s  %s\n' "$MODULE_SHA256" "$temp_dir/$MODULE_NAME" | sha256sum -c -
          printf '%s  %s\n' "$XML_SHA256" "$temp_dir/$XML_NAME" | sha256sum -c -

          vendor_root="$GITHUB_WORKSPACE/lite/mods/Package/KaoriosToolbox"
          rm -rf -- "$vendor_root/app" "$vendor_root/permissions" "$vendor_root/smali"
          mkdir -p "$vendor_root/app" "$vendor_root/permissions" "$vendor_root/smali" "$temp_dir/module"

          unzip -q "$temp_dir/$MODULE_NAME" -d "$temp_dir/module"

          mapfile -d '' -t apk_matches < <(
            find "$temp_dir/module" -type f -name 'KaoriosToolbox.apk' -print0
          )
          if [[ "${#apk_matches[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one KaoriosToolbox.apk, found ${#apk_matches[@]}"
            find "$temp_dir/module" -type f -name '*.apk' -print || true
            exit 1
          fi

          apk_relative="${apk_matches[0]#"$temp_dir/module/"}"
          echo "::notice::MODULE_APK_PATH=$apk_relative"

          cp -a "$(dirname "${apk_matches[0]}")" "$vendor_root/app/KaoriosToolbox"
          cp -p "$temp_dir/$XML_NAME" "$vendor_root/permissions/$XML_NAME"

          java -jar "$GITHUB_WORKSPACE/lite/tools/apktool/baksmaliv2.jar" d \
            --api 35 \
            "$temp_dir/$CLASSES_NAME" \
            -o "$vendor_root/smali"

          test -s "$vendor_root/app/KaoriosToolbox/KaoriosToolbox.apk"
          test -s "$vendor_root/permissions/$XML_NAME"
          test -s "$vendor_root/smali/android/security/kaorios/KaoriosHook.smali"
          test -s "$vendor_root/smali/com/kousei/framework/KaoriosFramework.smali"

          cat > "$vendor_root/SOURCE.txt" <<EOF
          Kaorios Toolbox ${KAORIOS_VERSION}
          Vendored into DeadZone-xiaomi_Lite for offline/reproducible builds.
          Upstream release: Wuang26/Kaorios-Toolbox ${KAORIOS_VERSION}
          module apk path: ${apk_relative}
          classes source: ${CLASSES_NAME}
          classes sha256: ${CLASSES_SHA256}
          module source: ${MODULE_NAME}
          module sha256: ${MODULE_SHA256}
          permissions source: ${XML_NAME}
          permissions sha256: ${XML_SHA256}
          Raw DEX and module ZIP are intentionally not stored; the DEX is committed as decoded Smali.
          EOF

          if find "$vendor_root" -type f \( -name '*.dex' -o -name '*.zip' \) -print -quit | grep -q .; then
            echo '::error::Raw DEX/ZIP unexpectedly present in vendored tree'
            exit 1
          fi

      - name: ✅ Commit vendored assets to Lite main
        working-directory: lite
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'DeadZone Vendor Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A mods/Package/KaoriosToolbox/app \
            mods/Package/KaoriosToolbox/permissions \
            mods/Package/KaoriosToolbox/smali \
            mods/Package/KaoriosToolbox/SOURCE.txt

          if git diff --cached --quiet; then
            echo 'Vendored Kaorios assets are already current.'
            exit 0
          fi

          git commit -m 'chore: record Kaorios module install path'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
