name: Validate Kaorios Offline Integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vendor-kaorios-to-lite.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ✅ Validate local Kaorios integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🔐 Validate target token
        shell: bash
        env:
          TARGET_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${TARGET_TOKEN:-}" || {
            echo '::error::GH_TOKEN secret is missing'
            exit 1
          }

      - name: 📥 Checkout Lite engine
        uses: actions/checkout@v4
        with:
          repository: mohammedmezo99/DeadZone-xiaomi_Lite
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: lite
          fetch-depth: 1
          persist-credentials: false

      - name: ✅ Validate scripts and vendored assets
        working-directory: lite
        shell: bash
        run: |
          set -Eeuo pipefail

          module='mods/Package/KaoriosToolbox'
          apply="$module/apply.sh"
          package='mods/Package/patchpackage.sh'

          bash -n "$apply"
          bash -n "$package"
          python3 -m py_compile \
            "$module/patch_common.py" \
            "$module/framework_patch.py" \
            "$module/services_patch.py"

          test -s "$module/app/KaoriosToolbox/KaoriosToolbox.apk"
          test -s "$module/permissions/com.kousei.kaorios.xml"
          test -s "$module/smali/android/security/kaorios/KaoriosHook.smali"
          test -s "$module/smali/com/kousei/framework/KaoriosFramework.smali"
          test -s "$module/app/KaoriosToolbox/lib/arm64/libandroidx.graphics.path.so"
          test -s "$module/app/KaoriosToolbox/lib/arm64/libdatastore_shared_counter.so"

          smali_count="$(find "$module/smali" -type f -name '*.smali' | wc -l)"
          test "$smali_count" -gt 1
          echo "Vendored Smali files: $smali_count"

          if find "$module" -type f \( -name '*.dex' -o -name '*.zip' \) -print -quit | grep -q .; then
            echo '::error::Raw DEX/ZIP found in Kaorios module'
            exit 1
          fi

          if grep -En 'https?://|github\.com|Wuang26|wget|curl|KAORIOS_RELEASE_BASE' "$apply"; then
            echo '::error::Kaorios apply.sh still contains an external build-time dependency'
            exit 1
          fi

          grep -Fq 'mezo_run_script "KaoriosToolbox" "$target_dir/KaoriosToolbox/apply.sh"' "$package"
          grep -Fq 'module apk path: system/priv-app/KaoriosToolbox/KaoriosToolbox.apk' "$module/SOURCE.txt"

          echo 'Kaorios offline integration validation passed.'
