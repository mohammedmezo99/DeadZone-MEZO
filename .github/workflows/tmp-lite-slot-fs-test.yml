name: Temporary Lite Slot FS Test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-lite-slot-fs-test.yml

permissions:
  contents: read

jobs:
  verify-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Lite engine commit
        uses: actions/checkout@v4
        with:
          repository: mohammedmezo99/DeadZone-xiaomi_Lite
          ref: 526785e61452d1dc067d0bb512e2f8e5750fb799
          token: ${{ secrets.GH_TOKEN }}
          path: lite
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile changed and regression tools
        working-directory: lite
        run: python -m py_compile scripts/package/apply_flash_slot_overrides.py scripts/verify/verify_slot_and_flash_behavior.py scripts/notification/notify.py scripts/notification/live_event.py scripts/verify/verify_live_event_behavior.py scripts/verify/verify_payload_metadata_behavior.py scripts/verify/verify_partition_reuse_behavior.py scripts/payload/payload_metadata.py scripts/partition/partition_reuse.py scripts/super/super_lpmake_args.py scripts/package/generate_flash_commands.py

      - name: Test slot and flash layout behavior
        working-directory: lite
        run: python -m unittest -v scripts/verify/verify_slot_and_flash_behavior.py

      - name: Test signed event contract
        working-directory: lite
        run: python scripts/notification/notify.py --self-test

      - name: Test live telemetry behavior
        working-directory: lite
        run: python -m unittest -v scripts/verify/verify_live_event_behavior.py

      - name: Test payload metadata behavior
        working-directory: lite
        run: python -m unittest -v scripts/verify/verify_payload_metadata_behavior.py

      - name: Test original partition image reuse
        working-directory: lite
        run: python -m unittest -v scripts/verify/verify_partition_reuse_behavior.py

      - name: Validate shell scripts
        working-directory: lite
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n build.sh scripts/upload/upload_rom.sh scripts/super/pack_super.sh scripts/package/pack_zip.sh scripts/environment/setup.sh scripts/core/functions.sh scripts/core/functions-core.sh scripts/notification/live-shell.sh scripts/super/super_metadata.sh scripts/device/collect_rom_metadata.sh
          find scripts mods templates -type f -name '*.sh' -print0 | xargs -0 -r bash -n
