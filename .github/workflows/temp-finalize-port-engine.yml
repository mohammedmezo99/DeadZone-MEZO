name: Temporary Finalize Port Engine

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-finalize-port-engine.yml"

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_HEAD: 51c4445fb361a3e90c755cc6c17ed1c243afe2e1
    steps:
      - name: Checkout Port target
        uses: actions/checkout@v4
        with:
          repository: mohammedmezo99/DeadZone-xiaomi_Port
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: target
          fetch-depth: 1

      - name: Guard Port head
        working-directory: target
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Finalize pack flow
        working-directory: target
        shell: python
        run: |
          from pathlib import Path

          build = Path('build.sh')
          text = build.read_text()
          old = 'super_list="vendor mi_ext odm odm_dlkm system system_dlkm vendor_dlkm product product_dlkm system_ext"'
          new = 'super_list="vendor mi_ext mi_product odm odm_dlkm system system_dlkm vendor_dlkm product product_dlkm system_ext"'
          if old not in text:
              raise SystemExit('build payload partition anchor missing')
          build.write_text(text.replace(old, new, 1))

          pack = Path('packROM.sh')
          text = pack.read_text()
          old = 'tools_dir=${work_dir}/bin/$(uname)/$(uname -m)export PATH=$(pwd)/bin/$(uname)/$(uname -m)/:$PATH\nsuper_list="vendor mi_ext odm odm_dlkm system system_dlkm vendor_dlkm product product_dlkm system_ext"'
          new = 'tools_dir="$work_dir/bin/$(uname)/$(uname -m)"\nexport PATH="$tools_dir:$PATH"\nsuper_list="vendor mi_ext mi_product odm odm_dlkm system system_dlkm vendor_dlkm product product_dlkm system_ext"'
          if old not in text:
              raise SystemExit('pack PATH/partition anchor missing')
          pack.write_text(text.replace(old, new, 1))

          merge = Path('bin/port/merge.sh')
          text = merge.read_text()
          anchor = '''if [[ "$port_generation" != MIUI ]]; then
              move_partition "$port_images" mi_ext true
          else
              move_partition "$port_images" mi_ext false
          fi

          move_partition "$stock_images" vendor true'''
          replacement = '''if [[ "$port_generation" != MIUI ]]; then
              move_partition "$port_images" mi_ext true
          else
              move_partition "$port_images" mi_ext false
          fi

          if [[ -d "$port_images/mi_product" ]]; then
              move_partition "$port_images" mi_product false
          else
              move_partition "$stock_images" mi_product false
          fi

          move_partition "$stock_images" vendor true'''
          if anchor not in text:
              raise SystemExit('merge mi_ext anchor missing')
          merge.write_text(text.replace(anchor, replacement, 1))

      - name: Validate syntax and merge ownership
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n build.sh
          bash -n packROM.sh
          bash -n bin/port/merge.sh
          grep -Fq 'export PATH="$tools_dir:$PATH"' packROM.sh
          grep -Fq 'mi_product' build.sh
          grep -Fq 'mi_product' packROM.sh
          grep -Fq 'move_partition "$port_images" mi_product false' bin/port/merge.sh

          rm -rf build
          mkdir -p \
            build/stockrom/images/config \
            build/portrom/images/config \
            build/.port_state/stock/ddevice \
            build/.port_state/port/ddevice
          printf 'garnet\n' > build/.port_state/stock/ddevice/device_f.txt
          printf 'OS2\n' > build/.port_state/port/ddevice/rom_os.txt
          printf 'STOCK-BOOT\n' > build/stockrom/images/boot.img

          for part in vendor odm mi_product; do
            mkdir -p "build/stockrom/images/$part"
            printf 'stock-%s\n' "$part" > "build/stockrom/images/$part/source.txt"
            printf '/ 0 0 0755\n' > "build/stockrom/images/config/${part}_fs_config"
            printf '/ u:object_r:system_file:s0\n' > "build/stockrom/images/config/${part}_file_contexts"
          done

          for part in system system_ext product mi_ext mi_product; do
            mkdir -p "build/portrom/images/$part"
            printf 'port-%s\n' "$part" > "build/portrom/images/$part/source.txt"
            printf '/ 0 0 0755\n' > "build/portrom/images/config/${part}_fs_config"
            printf '/ u:object_r:system_file:s0\n' > "build/portrom/images/config/${part}_file_contexts"
          done

          mkdir -p build/stockrom/images/product/etc/displayconfig
          printf 'stock-display\n' > build/stockrom/images/product/etc/displayconfig/test.xml

          bash bin/port/merge.sh
          test "$(cat build/baserom/images/system/source.txt)" = 'port-system'
          test "$(cat build/baserom/images/product/source.txt)" = 'port-product'
          test "$(cat build/baserom/images/mi_product/source.txt)" = 'port-mi_product'
          test "$(cat build/baserom/images/vendor/source.txt)" = 'stock-vendor'
          test "$(cat build/baserom/images/odm/source.txt)" = 'stock-odm'
          test "$(cat build/baserom/images/boot.img)" = 'STOCK-BOOT'
          test "$(cat build/baserom/images/product/etc/displayconfig/test.xml)" = 'stock-display'
          rm -rf build
          git diff --check -- build.sh packROM.sh bin/port/merge.sh

      - name: Commit to Port main
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- build.sh packROM.sh bin/port/merge.sh
          git diff --cached --stat
          git commit -m "port: finalize partition pack flow"
          git push origin HEAD:main

      - name: Verify pushed Port core
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf verify
          git clone --depth=1 --no-checkout --branch main "https://x-access-token:${GH_TOKEN}@github.com/mohammedmezo99/DeadZone-xiaomi_Port.git" verify
          git -C verify show HEAD:packROM.sh | grep -Fq 'export PATH="$tools_dir:$PATH"'
          git -C verify show HEAD:packROM.sh | grep -Fq 'mi_product'
          git -C verify show HEAD:build.sh | grep -Fq 'mi_product'
          git -C verify show HEAD:bin/port/merge.sh | grep -Fq 'mi_product'
          echo 'Port core verification passed'
