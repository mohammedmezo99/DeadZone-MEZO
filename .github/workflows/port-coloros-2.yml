name: MEZO-Port ColorOS 2

run-name: 🔂 MEZO-Port ColorOS 2 · ${{ inputs.request_id }} · ${{ inputs.builder_name || github.actor }}

concurrency:
  group: mezo-port-coloros-build-2
  queue: max

on:
  workflow_dispatch:
    inputs:
      stock_rom_url:
        description: Stock ROM HTTPS URL
        required: true
        type: string
      port_rom_url:
        description: Port ROM HTTPS URL
        required: true
        type: string
      builder_name:
        description: Telegram builder name
        required: false
        type: string
      builder_id:
        description: Telegram builder ID
        required: true
        type: string
      request_id:
        description: DeadZone Port build request ID
        required: true
        type: string
      callback_url:
        description: Signed DeadZone build-event endpoint
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: 🔂 ColorOS Port Worker 2
    uses: ./.github/workflows/port-coloros.yml
    with:
      stock_rom_url: ${{ inputs.stock_rom_url }}
      port_rom_url: ${{ inputs.port_rom_url }}
      builder_name: ${{ inputs.builder_name }}
      builder_id: ${{ inputs.builder_id }}
      request_id: ${{ inputs.request_id }}
      callback_url: ${{ inputs.callback_url }}
    secrets: inherit
