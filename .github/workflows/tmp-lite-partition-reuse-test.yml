name: Temporary Lite Partition Reuse Test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-lite-partition-reuse-test.yml

permissions:
  contents: read

jobs:
  verify-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Lite engine commit
        uses: actions/checkout@v4
        with:
          repository: mohammedmezo99/DeadZone-xiaomi_Lite
          ref: 7faa9ea51b82897882d2f032375df4dcc2f9c8d5
          token: ${{ secrets.GH_TOKEN }}
          path: lite
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile regression tools
        working-directory: lite
        run: python -m py_compile scripts/notification/notify.py scripts/notification/live_event.py scripts/verify/verify_live_event_behavior.py scripts/verify/verify_payload_metadata_behavior.py scripts/verify/verify_partition_reuse_behavior.py scripts/verify/verify_slot_and_flash_behavior.py scripts/payload/payload_metadata.py scripts/partition/partition_reuse.py scripts/super/super_lpmake_args.py scripts/package/generate_flash_commands.py scripts/package/apply_flash_slot_overrides.py

      - name: Test signed event contract
        working-directory: lite
        run: python scripts/notification/notify.py --self-test

      - name: Test live telemetry behavior
        working-directory: lite
        run: python -m unittest -v scripts/verify/verify_live_event_behavior.py

      - name: Test payload metadata behavior
        working-directory: lite
        run: python -m unittest -v scripts/verify/verify_payload_metadata_behavior.py

      - name: Test partition reuse runtime
        working-directory: lite
        run: python -m unittest -v scripts/verify/verify_partition_reuse_behavior.py

      - name: Test slot and flash layout behavior
        working-directory: lite
        run: python -m unittest -v scripts/verify/verify_slot_and_flash_behavior.py

      - name: Validate canonical repository paths
        working-directory: lite
        shell: bash
        run: |
          set -Eeuo pipefail
          required_paths=(
            scripts/core/functions.sh
            scripts/notification/live_event.py
            scripts/modifications/replace_configured_text_range.py
            scripts/package/prepare_rom_package.sh
            scripts/package/collect_flash_images.sh
            scripts/package/prepare_flash_template.sh
            tools/Linux/x86_64/lpmake
            tools/Linux/x86_64/make_ext4fs
            tools/Linux/x86_64/mkfs.erofs
            tools/apktool/apke.jar
            tools/apktool/baksmaliv2.jar
            tools/apktool/smaliv2.jar
            templates/flash/META-INF/Data/Structure
            mods/Package/KaoriosToolbox/apply.sh
            mods/Package/Disable\ Signature\ Verification/common/jar_engine.sh
          )
          for required_path in "${required_paths[@]}"; do
            git cat-file -e "HEAD:$required_path" || {
              echo "[ERROR] Missing canonical repository path: $required_path" >&2
              exit 1
            }
          done

      - name: Validate shell scripts
        working-directory: lite
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n build.sh scripts/upload/upload_rom.sh scripts/super/pack_super.sh scripts/package/pack_zip.sh scripts/environment/setup.sh scripts/core/functions.sh scripts/core/functions-core.sh scripts/notification/live-shell.sh scripts/super/super_metadata.sh
          find scripts mods templates -type f -name '*.sh' -print0 | xargs -0 -r bash -n
