name: Temporary Clone Lite Git Tree To Port

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-clone-lite-to-port-git-tree.yml"

permissions:
  contents: read

jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      SOURCE_COMMIT: 4749f27ae70c7f1df1baec19b311d69a1b81bc0f
      EXPECTED_TREE: 4c5a55439b543806a89e2e7c0a9854b6c45d0f9b
    steps:
      - name: Fetch Lite current tree as one Git pack
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_URL="https://x-access-token:${GH_TOKEN}@github.com/mohammedmezo99/DeadZone-xiaomi_Lite.git"
          git clone --depth=1 --no-checkout --branch main "$SOURCE_URL" source
          source_commit=$(git -C source rev-parse HEAD)
          source_tree=$(git -C source rev-parse HEAD^{tree})
          echo "Source commit: $source_commit"
          echo "Source tree: $source_tree"
          test "$source_commit" = "$SOURCE_COMMIT"
          test "$source_tree" = "$EXPECTED_TREE"

      - name: Publish same tree as Port root commit
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT_URL="https://x-access-token:${GH_TOKEN}@github.com/mohammedmezo99/DeadZone-xiaomi_Port.git"
          remote_main=$(git ls-remote --heads "$PORT_URL" refs/heads/main | awk '{print $1}')

          if [[ -n "$remote_main" ]]; then
            echo "Port main already exists; verifying it instead of overwriting."
            git -C source fetch --depth=1 "$PORT_URL" main:refs/remotes/port/main
            existing_tree=$(git -C source rev-parse refs/remotes/port/main^{tree})
            echo "Existing Port tree: $existing_tree"
            test "$existing_tree" = "$EXPECTED_TREE"
            exit 0
          fi

          git -C source config user.name "github-actions[bot]"
          git -C source config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          root_commit=$(printf '%s\n' "Initial Port source from DeadZone-xiaomi_Lite" | git -C source commit-tree "$EXPECTED_TREE")
          echo "Port root commit: $root_commit"
          git -C source push "$PORT_URL" "$root_commit:refs/heads/main"

      - name: Verify remote Port tree
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT_URL="https://x-access-token:${GH_TOKEN}@github.com/mohammedmezo99/DeadZone-xiaomi_Port.git"
          rm -rf verify-port
          git clone --depth=1 --no-checkout --branch main "$PORT_URL" verify-port
          port_tree=$(git -C verify-port rev-parse HEAD^{tree})
          echo "Expected Lite tree: $EXPECTED_TREE"
          echo "Port tree: $port_tree"
          test "$port_tree" = "$EXPECTED_TREE"
          echo "Exact Git-tree verification passed"
