name: Phase 2B Diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase2b-diagnostic.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct previous verified bundle
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?GH_TOKEN repository secret is required}"
          : > /tmp/bundle.b64
          for sha in \
            744e801fdd4f70493cbbdd8247ea299cbed3b858 \
            b54683a1fdc83064f9adf277f363316946adfb2a \
            1ca5ca6dce7b820933ee724afb87577324df1388 \
            fa0153648a00ac6747c507429d67e7296943c6ea \
            2fdd395d866ca2915b9d790fcb5409b259850f9c \
            e473f721c0beb61034ce7a57f227a00848fee96e \
            5cff2483aef3d574c0ace9ceb54e555a0140a1e9 \
            fa2b6c5c8b51bed111855359fc9a9d57eac0f9f2
          do
            gh api "repos/mohammedmezo99/DeadZone-MEZO/git/blobs/$sha" --jq .content | tr -d '\n' | base64 -d >> /tmp/bundle.b64
          done
          base64 -d /tmp/bundle.b64 > /tmp/bundle.tgz
          printf '%s  %s\n' '62720c863fee8329b5b4c2c773b2c4990544c7cd264a16bb004345887ded74d7' /tmp/bundle.tgz | sha256sum -c -
          mkdir -p /tmp/bundle
          tar -xzf /tmp/bundle.tgz -C /tmp/bundle --no-same-owner
          echo '--- BUNDLE TREE ---'
          find /tmp/bundle -maxdepth 4 -type f | sort
          echo '--- PAYLOAD VALIDATOR ---'
          grep -n -A90 -B10 'def _validate_payload_metadata' /tmp/bundle/candidate/scripts/state/build_state_schema.py || true
          echo '--- PAYLOAD PRODUCER RETURN ---'
          grep -n -A35 -B10 'def read_payload_metadata' /tmp/bundle/candidate/scripts/payload/read_payload_metadata.py || true
          echo '--- PAYLOAD PREPARATION ---'
          grep -n -A80 -B15 'payload' /tmp/bundle/candidate/scripts/rom/prepare_rom.py | head -220 || true

      - name: Remove diagnostic workflow
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          git rm .github/workflows/phase2b-diagnostic.yml
          git commit -m 'chore: remove Phase 2B diagnostic'
          git push origin HEAD:main
