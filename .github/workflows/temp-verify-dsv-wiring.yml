name: Temporary Verify DSV Wiring

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-verify-dsv-wiring.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout official Lite
        uses: actions/checkout@v4
        with:
          repository: mohammedmezo99/DeadZone-xiaomi_Lite
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: lite
          fetch-depth: 1

      - name: Checkout source Lite DSV
        uses: actions/checkout@v4
        with:
          repository: mohammedmezo99/xiaomi_Lite
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            mods/Package/Disable Signature Verification
          sparse-checkout-cone-mode: false

      - name: Validate dispatcher wiring
        working-directory: lite
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n bin/package/patchpackage.sh
          grep -F 'run_disable_signature_verification || exit $?' bin/package/patchpackage.sh
          ! grep -F 'COREPATCH/update.sh' bin/package/patchpackage.sh

      - name: Verify DSV payload remains byte-identical
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import stat
          from pathlib import Path

          src = Path('source/mods/Package/Disable Signature Verification')
          dst = Path('lite/bin/package/Disable Signature Verification')

          def digest(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def snapshot(root: Path):
              result = {}
              for base, dirs, files in os.walk(root, topdown=True, followlinks=False):
                  base_path = Path(base)
                  for name in sorted(dirs + files):
                      path = base_path / name
                      rel = path.relative_to(root).as_posix()
                      st = path.lstat()
                      mode = stat.S_IMODE(st.st_mode)
                      if path.is_symlink():
                          result[rel] = ('symlink', mode, os.readlink(path))
                      elif path.is_dir():
                          result[rel] = ('dir', mode)
                      elif path.is_file():
                          result[rel] = ('file', mode, st.st_size, digest(path))
              return result

          assert snapshot(src) == snapshot(dst), 'DSV payload changed during wiring'
          print('DSV payload is still byte-identical to source.')
          PY

      - name: Validate compatibility shim and cleanup
        working-directory: lite
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p bin/ddevice
          printf '11\n' > bin/ddevice/androidver.txt
          awk '/^run_disable_signature_verification \|\| exit/{exit} {print}' bin/package/patchpackage.sh > /tmp/dsv-defs.sh
          source /tmp/dsv-defs.sh
          set +e
          run_disable_signature_verification
          rc=$?
          set -e
          [[ $rc -ne 0 ]]
          [[ ! -e 'mods/Package/Disable Signature Verification' ]]
          [[ ! -e 'scripts/core/functions.sh' ]]
          [[ ! -e 'tools/apktool' ]]
          [[ ! -e 'build/.deadzone/state/androidver.txt' ]]
          echo 'Compatibility paths resolved and were cleaned after DSV exit.'
