name: Temporary Xiaomi Lite Tool Vendor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-vendor-xiaomi-lite-tools.yml

permissions:
  contents: read

jobs:
  vendor-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mohammedmezo99/xiaomi_Lite
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: lite
          fetch-depth: 0

      - name: Vendor pinned Phase 2B tools
        working-directory: lite
        shell: bash
        run: |
          set -euo pipefail
          expected='ad158a108fa2c79dc0863ac0f9a2d50963303bd7'
          [[ "$(git rev-parse HEAD)" == "$expected" ]] || { echo '::error::xiaomi_Lite main changed'; exit 1; }

          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          rm -rf tools
          mkdir -p tools/linux/x86_64 tools/python tools/licenses

          payload_url='https://github.com/ssut/payload-dumper-go/releases/download/2.0.0/payload-dumper-go_2.0.0_linux_amd64.tar.gz'
          payload_archive_sha='ac3f27435e0c88d4b552f343765f78fa44b552e4cd9892ff492fff929a1c4e6e'
          curl -fL --retry 4 --retry-all-errors "$payload_url" -o "$stage/payload.tar.gz"
          echo "$payload_archive_sha  $stage/payload.tar.gz" | sha256sum -c -
          mkdir "$stage/payload"
          tar -xzf "$stage/payload.tar.gz" -C "$stage/payload"
          payload_bin="$(find "$stage/payload" -type f -name payload-dumper-go -print -quit)"
          [[ -f "$payload_bin" ]]
          install -m 0755 "$payload_bin" tools/linux/x86_64/payload-dumper-go

          git clone --quiet https://github.com/sebaubuntu-python/liblp.git "$stage/liblp"
          git -C "$stage/liblp" checkout --quiet 690849754888b2a624bd4c30b8a3c37416a50a75
          [[ "$(git -C "$stage/liblp" rev-parse HEAD)" == '690849754888b2a624bd4c30b8a3c37416a50a75' ]]
          cp -a "$stage/liblp/liblp" tools/python/liblp
          cp "$stage/liblp/pyproject.toml" tools/python/liblp.pyproject.toml

          curl -fL 'https://raw.githubusercontent.com/ssut/payload-dumper-go/c4effb7bbb0d097f11110f620948daf92ab362fc/LICENSE' -o tools/licenses/Apache-2.0.txt

          tools/linux/x86_64/payload-dumper-go --help > "$stage/payload-help"
          grep -qi payload "$stage/payload-help"
          python -m compileall -q tools/python/liblp
          PYTHONPATH="$PWD/tools/python" python -m liblp.partition_tools.lpunpack --help > "$stage/lp-help"
          grep -qi 'extracting partition images from super' "$stage/lp-help"

          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          find tools -type f -name '*.pyc' -delete

          payload_sha="$(sha256sum tools/linux/x86_64/payload-dumper-go | awk '{print $1}')"
          liblp_sha="$(python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('tools/python/liblp'); h=hashlib.sha256()
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              r=p.relative_to(root).as_posix().encode(); d=p.read_bytes()
              h.update(len(r).to_bytes(4,'big')+r+len(d).to_bytes(8,'big')+d)
          print(h.hexdigest())
          PY
          )"

          python - "$payload_sha" "$liblp_sha" <<'PY'
          import json,sys
          from pathlib import Path
          psha,lsha=sys.argv[1:]
          data={
            'schema':1,
            'tools':[
              {'name':'payload-dumper-go','version':'2.0.0','platform':'linux','architecture':'x86_64','path':'tools/linux/x86_64/payload-dumper-go','sha256':psha,'source':'https://github.com/ssut/payload-dumper-go','source_ref':'c4effb7bbb0d097f11110f620948daf92ab362fc','release_archive_sha256':'ac3f27435e0c88d4b552f343765f78fa44b552e4cd9892ff492fff929a1c4e6e','license':'Apache-2.0','purpose':'Extract payload.bin partitions'},
              {'name':'liblp','version':'1.0.2','platform':'python>=3.8','architecture':'any','path':'tools/python/liblp','tree_sha256':lsha,'source':'https://github.com/sebaubuntu-python/liblp','source_ref':'690849754888b2a624bd4c30b8a3c37416a50a75','license':'Apache-2.0','purpose':'Read LP metadata and extract logical partitions from raw Super images'}
            ],
            'notes':{'sparse_images':'Sparse parsing is already owned by xiaomi_Lite; Phase 2B will add and verify fail-closed sparse-to-raw normalization instead of vendoring an unlicensed Super binary.','runtime_downloads':'Critical extraction tools must be used from this repository, not downloaded during production builds.'}
          }
          Path('tools/manifest.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY

          cat > tools/README.md <<'EOF'
          # Vendored extraction tools
          Phase 2B critical extraction dependencies live here so production builds do not download them at runtime.
          `payload-dumper-go` 2.0.0 is pinned for OTA payload extraction.
          `liblp` 1.0.2 is pinned for LP metadata and Super logical partition extraction, including explicit metadata slot selection.
          Integrity and provenance are recorded in `tools/manifest.json`.
          EOF

          rm -f .github/workflows/vendor-phase2b-tools.yml

          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('tools/manifest.json').read_text())
          p=next(x for x in m['tools'] if x['name']=='payload-dumper-go')
          assert hashlib.sha256(Path(p['path']).read_bytes()).hexdigest()==p['sha256']
          assert not list(Path('tools').rglob('__pycache__'))
          assert not list(Path('tools').rglob('*.pyc'))
          print('VENDORED_TOOL_VERIFICATION_PASS')
          PY

      - name: Commit to Xiaomi Lite main
        working-directory: lite
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A tools .github/workflows/vendor-phase2b-tools.yml
          git commit -m 'chore: vendor pinned Phase 2B extraction tools'
          git push origin HEAD:main
