name: Temporary Commit Port Finish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-commit-port-finish.yml"

permissions:
  contents: read

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: 6bd3bd08c4b0f071ddf051ba71e76468a2415325
    steps:
      - name: Checkout launcher
        uses: actions/checkout@v4
        with:
          path: launcher
          fetch-depth: 1

      - name: Checkout Port target
        uses: actions/checkout@v4
        with:
          repository: mohammedmezo99/DeadZone-xiaomi_Port
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: target
          fetch-depth: 1

      - name: Extract finish script
        shell: python
        run: |
          from pathlib import Path
          text = Path('launcher/.github/workflows/temp-finish-port-conversion.yml').read_text()
          section = text.split('      - name: Finish Port identity and runtime\n', 1)[1]
          section = section.split('\n      - name: Validate before push', 1)[0]
          block = section.split('        run: |\n', 1)[1]
          output = []
          for line in block.splitlines():
              if not line:
                  output.append('')
              elif line.startswith('          '):
                  output.append(line[10:])
              else:
                  raise SystemExit(f'unexpected indentation: {line!r}')
          Path('/tmp/finish-port.sh').write_text('\n'.join(output) + '\n')

      - name: Apply and validate
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          bash /tmp/finish-port.sh
          bash -n build.sh
          bash -n setup.sh
          bash -n uploadROM.sh
          bash -n bin/port/merge.sh
          bash -n bin/port/uploadROM.sh
          python3 -m py_compile notify.py
          grep -Fq 'DeadZone_Port_V${version_number}_${codename_upper}_${rom_version_component}_${region_component}-A${android_digits}.zip' bin/port/uploadROM.sh
          grep -Fq '${RCLONE_UPLOAD_DIR%/}/Port/${codename_upper}/${os_folder}/${final_name}' bin/port/uploadROM.sh
          grep -Fq 'port_[A-Za-z0-9]{8,80}' notify.py
          grep -Fq '"project": "port"' notify.py
          grep -Fq 'stock_device_name' notify.py
          grep -Fq 'port_device_name' notify.py
          rm -rf __pycache__
          git diff --check -- build.sh notify.py uploadROM.sh setup.sh bin/port/merge.sh bin/port/uploadROM.sh README.MD

      - name: Commit directly to main
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- build.sh notify.py uploadROM.sh setup.sh bin/port/merge.sh bin/port/uploadROM.sh README.MD
          git commit -m "port: wire Port identity upload and telemetry"
          git push origin HEAD:main
