name: Temporary Final Lite Identity Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-sync-lite-device-catalog.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout official Lite engine
        uses: actions/checkout@v4
        with:
          repository: mohammedmezo99/DeadZone-xiaomi_Lite
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: lite
          fetch-depth: 1

      - name: Verify final identity pipeline
        working-directory: lite
        run: |
          set -Eeuo pipefail
          bash -n bin/ddevice/fetchINFO.sh
          python3 -m py_compile notify.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          import notify

          catalog = json.loads(Path("bin/ddevice/data/devices.json").read_text(encoding="utf-8"))
          assert catalog["creek"]
          assert catalog["garnet"]
          assert catalog["tornado"]
          assert notify._device_family("POCO M7 / Redmi 15", {}) == "POCO / Redmi"
          assert notify._device_family("POCO X6 5G", {}) == "POCO"
          assert notify._device_family("Redmi 15", {}) == "Redmi"
          assert notify._device_family("Xiaomi Pad 7", {}) == "Pad"
          print("Final Lite identity telemetry checks passed")
          PY
