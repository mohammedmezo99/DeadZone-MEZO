name: Temporary Lite ROM Identity Test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-lite-rom-identity-test.yml

permissions:
  contents: read

jobs:
  verify-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Lite engine commit
        uses: actions/checkout@v4
        with:
          repository: mohammedmezo99/DeadZone-xiaomi_Lite
          ref: 4b69631f6064cada3b192dbf8d1cc50905828194
          token: ${{ secrets.GH_TOKEN }}
          path: lite
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile regression tools
        working-directory: lite
        run: python -m py_compile scripts/verify/verify_rom_identity_behavior.py scripts/verify/verify_slot_and_flash_behavior.py scripts/verify/verify_partition_reuse_behavior.py scripts/verify/verify_payload_metadata_behavior.py scripts/verify/verify_live_event_behavior.py

      - name: Test extracted ROM identity behavior
        working-directory: lite
        run: python -m unittest -v scripts/verify/verify_rom_identity_behavior.py

      - name: Test generic and Xiaomi.eu filename hints
        working-directory: lite
        shell: bash
        run: |
          set -Eeuo pipefail
          download_script="$PWD/scripts/rom/download_rom.sh"
          test_root="$RUNNER_TEMP/lite-rom-filename-hints"
          rm -rf "$test_root"

          prepare_case() {
            local case_dir="$1"
            rm -rf "$case_dir"
            mkdir -p "$case_dir/scripts/core" "$case_dir/build/.deadzone/state"
            cat > "$case_dir/scripts/core/functions.sh" <<'SH'
          info(){ :; }
          error(){ printf '[ERROR] %s\n' "$*" >&2; }
          SH
          }

          generic="$test_root/generic"
          prepare_case "$generic"
          printf 'rom\n' > "$generic/MEZO_TEST.zip"
          CASE_DIR="$generic" DOWNLOAD_SCRIPT="$download_script" bash -c '
            set -Eeuo pipefail
            cd "$CASE_DIR"
            source "$DOWNLOAD_SCRIPT" "$CASE_DIR/MEZO_TEST.zip"
            [[ -z "$device_code" ]]
            [[ -z "$base_rom_code" ]]
            [[ -z "$ROM_OS" ]]
            [[ -z "$DEVICE_TYPE" ]]
          '

          eu="$test_root/xiaomi-eu"
          prepare_case "$eu"
          printf 'rom\n' > "$eu/xiaomi.eu_GARNET_OS3.0.1.0.VMIXM.zip"
          CASE_DIR="$eu" DOWNLOAD_SCRIPT="$download_script" bash -c '
            set -Eeuo pipefail
            cd "$CASE_DIR"
            source "$DOWNLOAD_SCRIPT" "$CASE_DIR/xiaomi.eu_GARNET_OS3.0.1.0.VMIXM.zip"
            [[ "$device_code" == "GARNET" ]]
            [[ "$base_rom_code" == "OS3.0.1.0.VMIXM" ]]
            [[ "$ROM_OS" == "OS3" ]]
          '

      - name: Run existing regression suite
        working-directory: lite
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/notification/notify.py --self-test
          python -m unittest -v scripts/verify/verify_live_event_behavior.py
          python -m unittest -v scripts/verify/verify_payload_metadata_behavior.py
          python -m unittest -v scripts/verify/verify_partition_reuse_behavior.py
          python -m unittest -v scripts/verify/verify_slot_and_flash_behavior.py

      - name: Validate shell scripts
        working-directory: lite
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/rom/download_rom.sh scripts/device/collect_rom_metadata.sh
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r bash -n
