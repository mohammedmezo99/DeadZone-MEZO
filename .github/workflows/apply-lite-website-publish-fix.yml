name: Apply Lite website publishing fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-lite-website-publish-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Apply exact website publishing fix
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/lite-core.yml')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "          printf 'DEADZONE_FILE_SIZE=%s\\nDEADZONE_INTEGRITY_VERIFIED=1\\n' \"$final_size_human\" >> \"$GITHUB_ENV\"",
                  "          printf 'DEADZONE_FILE_SIZE=%s\\nDEADZONE_INTEGRITY_VERIFIED=1\\nDEADZONE_RESULT_NAME=%s\\n' \"$final_size_human\" \"$final_name\" >> \"$GITHUB_ENV\"",
              ),
              (
                  '''          if [[ -z "${DEADZONE_GOOGLE_DRIVE_URL:-}" || "${DEADZONE_INTEGRITY_VERIFIED:-0}" != "1" || -z "${DEADZONE_FILE_SIZE:-}" ]]; then
            echo "::warning::Website release skipped because Google Drive or ZIP verification metadata is unavailable"
            exit 0
          fi''',
                  '''          website_url="${DEADZONE_GOOGLE_DRIVE_URL:-}"
          [[ -n "$website_url" ]] || website_url="${DEADZONE_SOURCEFORGE_URL:-}"
          [[ -n "$website_url" ]] || website_url="${DEADZONE_PIXELDRAIN_URL:-}"

          if [[ -z "$website_url" || "${DEADZONE_INTEGRITY_VERIFIED:-0}" != "1" || -z "${DEADZONE_FILE_SIZE:-}" || -z "${DEADZONE_RESULT_NAME:-}" ]]; then
            echo "::warning::Website release skipped: no successful download mirror or verified ZIP metadata is available"
            exit 0
          fi
          export DEADZONE_WEBSITE_DOWNLOAD_URL="$website_url"''',
              ),
              (
                  '''          filename = env("DEADZONE_RESULT_NAME")
          drive_url = env("DEADZONE_GOOGLE_DRIVE_URL")
          parsed = urlparse(drive_url)
          if not re.fullmatch(r"[a-z0-9][a-z0-9_-]{1,39}", codename):
              raise SystemExit("Invalid website release codename")
          if not filename.lower().endswith(".zip") or "/" in filename or "\\\\" in filename:
              raise SystemExit("Invalid website release filename")
          if parsed.scheme != "https" or parsed.hostname != "drive.google.com" or parsed.username or parsed.password:
              raise SystemExit("Website release requires a safe Google Drive URL")''',
                  '''          filename = env("DEADZONE_RESULT_NAME")
          download_url = env("DEADZONE_WEBSITE_DOWNLOAD_URL")
          parsed = urlparse(download_url)
          allowed_hosts = {"drive.google.com", "sourceforge.net", "pixeldrain.com"}
          if not re.fullmatch(r"[a-z0-9][a-z0-9_-]{1,39}", codename):
              raise SystemExit("Invalid website release codename")
          if not filename.lower().endswith(".zip") or "/" in filename or "\\\\" in filename:
              raise SystemExit("Invalid website release filename")
          if parsed.scheme != "https" or parsed.hostname not in allowed_hosts or parsed.username or parsed.password:
              raise SystemExit("Website release requires a safe supported download URL")''',
              ),
              (
                  '              "downloadUrl": drive_url,',
                  '              "downloadUrl": download_url,',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one website publishing replacement target; found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          grep -Fq 'DEADZONE_RESULT_NAME=%s' .github/workflows/lite-core.yml
          grep -Fq 'DEADZONE_WEBSITE_DOWNLOAD_URL' .github/workflows/lite-core.yml
          grep -Fq 'allowed_hosts = {"drive.google.com", "sourceforge.net", "pixeldrain.com"}' .github/workflows/lite-core.yml

      - name: Commit final fix
        run: |
          set -Eeuo pipefail
          rm -f scripts/fix-lite-website-publish.patch
          rm -f .github/workflows/apply-lite-website-publish-fix.yml
          git config user.name 'DeadZone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix Lite website release publishing'
          git push origin HEAD:main
