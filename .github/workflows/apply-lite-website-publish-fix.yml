name: Apply Lite website publishing fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-lite-website-publish-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Apply line-safe website publishing fix
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/lite-core.yml')
          lines = path.read_text(encoding='utf-8').splitlines()

          def unique(needle):
              matches = [i for i, line in enumerate(lines) if needle in line]
              if len(matches) != 1:
                  raise SystemExit(f'Expected one line containing {needle!r}; found {len(matches)}')
              return matches[0]

          i = unique("printf 'DEADZONE_FILE_SIZE=%s\\nDEADZONE_INTEGRITY_VERIFIED=1\\n'")
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i] = indent + "printf 'DEADZONE_FILE_SIZE=%s\\nDEADZONE_INTEGRITY_VERIFIED=1\\nDEADZONE_RESULT_NAME=%s\\n' \"$final_size_human\" \"$final_name\" >> \"$GITHUB_ENV\""

          i = unique('if [[ -z "${DEADZONE_GOOGLE_DRIVE_URL:-}"')
          if i + 3 >= len(lines) or lines[i + 3].strip() != 'fi':
              raise SystemExit('Website publishing guard shape changed')
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i:i + 4] = [
              indent + 'website_url="${DEADZONE_GOOGLE_DRIVE_URL:-}"',
              indent + '[[ -n "$website_url" ]] || website_url="${DEADZONE_SOURCEFORGE_URL:-}"',
              indent + '[[ -n "$website_url" ]] || website_url="${DEADZONE_PIXELDRAIN_URL:-}"',
              '',
              indent + 'if [[ -z "$website_url" || "${DEADZONE_INTEGRITY_VERIFIED:-0}" != "1" || -z "${DEADZONE_FILE_SIZE:-}" || -z "${DEADZONE_RESULT_NAME:-}" ]]; then',
              indent + '  echo "::warning::Website release skipped: no successful download mirror or verified ZIP metadata is available"',
              indent + '  exit 0',
              indent + 'fi',
              indent + 'export DEADZONE_WEBSITE_DOWNLOAD_URL="$website_url"',
          ]

          i = unique('drive_url = env("DEADZONE_GOOGLE_DRIVE_URL")')
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          if 'parsed = urlparse(drive_url)' not in lines[i + 1]:
              raise SystemExit('Website URL parser shape changed')
          lines[i:i + 2] = [
              indent + 'download_url = env("DEADZONE_WEBSITE_DOWNLOAD_URL")',
              indent + 'parsed = urlparse(download_url)',
              indent + 'allowed_hosts = {"drive.google.com", "sourceforge.net", "pixeldrain.com"}',
          ]

          i = unique('parsed.hostname != "drive.google.com"')
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          if i + 1 >= len(lines) or 'safe Google Drive URL' not in lines[i + 1]:
              raise SystemExit('Website URL validation shape changed')
          lines[i] = indent + 'if parsed.scheme != "https" or parsed.hostname not in allowed_hosts or parsed.username or parsed.password:'
          lines[i + 1] = indent + '    raise SystemExit("Website release requires a safe supported download URL")'

          i = unique('"downloadUrl": drive_url,')
          lines[i] = lines[i].replace('"downloadUrl": drive_url,', '"downloadUrl": download_url,')

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          git diff --check
          grep -Fq 'DEADZONE_RESULT_NAME=%s' .github/workflows/lite-core.yml
          grep -Fq 'DEADZONE_WEBSITE_DOWNLOAD_URL' .github/workflows/lite-core.yml
          grep -Fq 'allowed_hosts = {"drive.google.com", "sourceforge.net", "pixeldrain.com"}' .github/workflows/lite-core.yml

      - name: Commit final fix
        run: |
          set -Eeuo pipefail
          rm -f scripts/fix-lite-website-publish.patch
          rm -f .github/workflows/apply-lite-website-publish-fix.yml
          git config user.name 'DeadZone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix Lite website release publishing'
          git push origin HEAD:main
