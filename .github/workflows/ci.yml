name: DeadZone Launcher CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/reliable-terminal-events

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Compile launcher reporter
        run: python3 -m py_compile scripts/report_build_event.py
      - name: Test launcher reporter
        run: python3 scripts/report_build_event.py --self-test
      - name: Verify terminal hooks
        run: |
          set -Eeuo pipefail
          grep -Fq 'python3 scripts/report_build_event.py failed' .github/workflows/build.yml
          grep -Fq 'python3 scripts/report_build_event.py cancelled' .github/workflows/build.yml
          grep -Fq 'python3 scripts/report_build_event.py failed' .github/workflows/port.yml
          grep -Fq 'python3 scripts/report_build_event.py cancelled' .github/workflows/port.yml
          ! grep -A2 -F 'Send failure notification' .github/workflows/build.yml | grep -Fq 'continue-on-error: true'
          ! grep -A2 -F 'Report failed Port build' .github/workflows/port.yml | grep -Fq 'continue-on-error: true'
