name: Apply Lite website release integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-lite-website-release.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Validate and apply patch
        run: |
          set -Eeuo pipefail
          git apply --check scripts/lite-website.patch
          git apply scripts/lite-website.patch
          git diff --check
          grep -Fq 'Publish Lite release to website' .github/workflows/lite-core.yml
          grep -Fq 'DEADZONE_INTEGRITY_VERIFIED=1' .github/workflows/lite-core.yml

      - name: Commit final integration
        run: |
          set -Eeuo pipefail
          rm -f scripts/lite-website.patch
          rm -f .github/workflows/apply-lite-website-release.yml
          git config user.name 'DeadZone Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Publish successful Lite builds to website'
          git push origin HEAD:main
