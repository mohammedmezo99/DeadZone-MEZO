name: DeadZone MEZO ROM Launcher

run-name: DeadZone build by ${{ inputs.builder_name || github.actor }}

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: ROM download URL
        required: true
        type: string
      builder_name:
        description: Builder name
        required: false
        type: string
      builder_id:
        description: Telegram user ID
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ROM
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Validate launcher credential
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Missing required repository secret: GH_TOKEN"
            exit 1
          fi

      - name: Checkout private runtime
        uses: actions/checkout@v4
        with:
          repository: mohammedmezo99/DeadZone-File
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: runtime
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            projects.env
            build.env
            rclone.conf
            load-build.sh
          sparse-checkout-cone-mode: false

      - name: Load central runtime
        id: runtime
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DEADZONE_CONTROLLED_BUILD: "0"
        run: |
          set -euo pipefail
          for runtime_file in projects.env build.env rclone.conf load-build.sh; do
            if [[ ! -s "runtime/${runtime_file}" ]]; then
              echo "::error::Central runtime file is missing or empty: ${runtime_file}"
              exit 1
            fi
          done
          chmod 700 runtime/load-build.sh
          runtime/load-build.sh lite

      - name: Validate loaded runtime
        env:
          ENGINE_REPOSITORY: ${{ steps.runtime.outputs.engine_repository }}
        run: |
          set -euo pipefail
          required=(
            ENGINE_REPOSITORY
            DEADZONE_ENGINE_REPOSITORY
            TELEGRAM_BOT_TOKEN
            TELEGRAM_RELEASE_GROUP_ID
            RCLONE_REMOTE_NAME
            RCLONE_UPLOAD_DIR
          )
          for variable_name in "${required[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Central runtime value is missing: ${variable_name}"
              exit 1
            fi
          done
          if [[ "$ENGINE_REPOSITORY" != "$DEADZONE_ENGINE_REPOSITORY" ]]; then
            echo "::error::Runtime engine output does not match the loaded project map"
            exit 1
          fi
          printf '::add-mask::%s\n' "$TELEGRAM_RELEASE_GROUP_ID"
          printf 'TELEGRAM_CHANNEL_ID=%s\n' "$TELEGRAM_RELEASE_GROUP_ID" >> "$GITHUB_ENV"
          printf 'RCLONE_CONFIG_BASE64=\n' >> "$GITHUB_ENV"

      - name: Maximize build space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      - name: Clean unused runner packages
        run: |
          set -euo pipefail
          docker image prune --all --force || true
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android || true
          sudo apt-get purge -y azure-cli "ghc*" "zulu*" "hhvm*" "llvm*" firefox "google*" "dotnet*" powershell "mysql*" "php*" || true
          sudo apt-get autoremove --purge -y || true
          sudo apt-get clean

      - name: Checkout private builder source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.runtime.outputs.engine_repository }}
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: toolbuild
          lfs: true
          fetch-depth: 1
          persist-credentials: false

      - name: Set Cairo timezone
        run: sudo timedatectl set-timezone Africa/Cairo

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install builder dependencies
        working-directory: toolbuild
        run: |
          set -euo pipefail
          sudo bash setup.sh 2>&1 | tee setup_action.log
          sudo pip3 install --no-cache-dir requests 2>&1 | tee -a setup_action.log

      - name: Grant builder permissions
        working-directory: toolbuild
        run: chmod -R u+rwX,go+rX .

      - name: Install central Rclone configuration
        working-directory: toolbuild
        run: |
          set -euo pipefail
          source_file="$GITHUB_WORKSPACE/runtime/rclone.conf"
          target_file="$PWD/rclone.conf"
          configured_remote="$(sed -n 's/^\[\([^]]\+\)\]$/\1/p' "$source_file" | head -n 1)"

          if [[ -z "$configured_remote" ]]; then
            echo "::error::Central rclone.conf does not define a remote"
            exit 1
          fi
          if [[ "$configured_remote" != "$RCLONE_REMOTE_NAME" ]]; then
            echo "::error::Rclone remote metadata does not match rclone.conf"
            exit 1
          fi

          install -m 600 "$source_file" "$target_file"
          if ! rclone listremotes --config "$target_file" | grep -Fxq "${RCLONE_REMOTE_NAME}:"; then
            echo "::error::Rclone configuration is not compatible with the loaded runtime"
            exit 1
          fi

      - name: Send start notification
        working-directory: toolbuild
        run: |
          set -euo pipefail
          python3 notify.py start "${{ github.repository }}" "${{ inputs.input_url }}" "mezo" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"

      - name: Build ROM
        working-directory: toolbuild
        run: |
          set -euo pipefail
          sudo -E bash build.sh "${{ inputs.input_url }}" "${{ github.repository }}" "mezo" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}" 2>&1 | tee build_action.log

      - name: Pack ROM
        working-directory: toolbuild
        run: |
          set -euo pipefail
          sudo -E bash packROM.sh 2>&1 | tee -a build_action.log

      - name: Upload ROM
        working-directory: toolbuild
        run: |
          set -euo pipefail
          python3 notify.py upload "${{ github.repository }}" "${{ inputs.input_url }}" "mezo" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"
          sudo -E bash uploadROM.sh 2>&1 | tee -a build_action.log

      - name: Send success notification
        if: success()
        working-directory: toolbuild
        run: |
          python3 notify.py success "${{ github.repository }}" "${{ inputs.input_url }}" "mezo" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"

      - name: Send failure notification
        if: failure() && hashFiles('toolbuild/notify.py') != ''
        working-directory: toolbuild
        run: |
          python3 notify.py fail "${{ github.repository }}" "${{ inputs.input_url }}" "mezo" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"

      - name: Send cancellation notification
        if: cancelled() && hashFiles('toolbuild/notify.py') != ''
        working-directory: toolbuild
        run: |
          python3 notify.py cancelled "${{ github.repository }}" "${{ inputs.input_url }}" "mezo" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"

      - name: Remove private runtime files
        if: always()
        run: |
          rm -rf runtime
          rm -f toolbuild/rclone.conf
