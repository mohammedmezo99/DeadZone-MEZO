name: MEZO-Port ColorOS
run-name: 🔂 MEZO-Port ColorOS · ${{ inputs.request_id }} · ${{ inputs.builder_name || github.actor }}

on:
  workflow_dispatch:
    inputs:
      stock_rom_url:
        description: Stock ROM HTTPS URL
        required: true
        type: string
      port_rom_url:
        description: Port ROM HTTPS URL
        required: true
        type: string
      builder_name:
        description: Telegram builder name
        required: false
        type: string
      builder_id:
        description: Telegram builder ID
        required: true
        type: string
      request_id:
        description: DeadZone Port build request ID
        required: true
        type: string
      callback_url:
        description: Signed DeadZone build-event endpoint
        required: true
        type: string

  workflow_call:
    inputs:
      stock_rom_url:
        required: true
        type: string
      port_rom_url:
        required: true
        type: string
      builder_name:
        required: false
        type: string
      builder_id:
        required: true
        type: string
      request_id:
        required: true
        type: string
      callback_url:
        required: true
        type: string
    secrets:
      GH_TOKEN:
        required: true
      SOURCEFORGE_SSH_PRIVATE_KEY:
        required: true
      PIXELDRAIN_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: 🔂 Build DeadZone ColorOS Port
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
      DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
      DEADZONE_PROJECT: port_coloros
      DEADZONE_CONTROLLED_BUILD: "1"
      DEADZONE_STOCK_ROM_URL: ${{ inputs.stock_rom_url }}
      DEADZONE_PORT_ROM_URL: ${{ inputs.port_rom_url }}
      DEADZONE_BUILDER_NAME: ${{ inputs.builder_name }}
      DEADZONE_BUILDER_ID: ${{ inputs.builder_id }}
      DEADZONE_SOURCE_REPOSITORY: ${{ github.repository }}

    steps:
      - name: 🔐 Validate Port request
        shell: python
        env:
          STOCK_ROM_URL: ${{ inputs.stock_rom_url }}
          PORT_ROM_URL: ${{ inputs.port_rom_url }}
          REQUEST_ID: ${{ inputs.request_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          import os
          import re
          from urllib.parse import urlparse

          request_id = os.environ["REQUEST_ID"].strip()
          if not re.fullmatch(r"port_coloros_[A-Za-z0-9]{8,80}", request_id):
              raise SystemExit("Invalid DeadZone Port request ID")

          for name in ("STOCK_ROM_URL", "PORT_ROM_URL", "CALLBACK_URL"):
              value = os.environ[name].strip()
              parsed = urlparse(value)
              if (
                  parsed.scheme != "https"
                  or not parsed.hostname
                  or parsed.username
                  or parsed.password
                  or len(value) > 2048
              ):
                  raise SystemExit(f"{name} must be a safe HTTPS URL")

      - name: 🔐 Validate publishing credentials
        shell: bash
        env:
          DEADZONE_RUNTIME_TOKEN: ${{ secrets.GH_TOKEN }}
          SOURCEFORGE_SSH_PRIVATE_KEY: ${{ secrets.SOURCEFORGE_SSH_PRIVATE_KEY }}
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          set -Eeuo pipefail
          required=(DEADZONE_RUNTIME_TOKEN SOURCEFORGE_SSH_PRIVATE_KEY PIXELDRAIN_API_KEY)
          for variable_name in "${required[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Missing required publishing secret: ${variable_name}"
              exit 1
            fi
          done

      - name: 📥 Checkout DeadZone launcher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: 🔐 Load DeadZone central runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mohammedmezo99/DeadZone-File
          token: ${{ secrets.GH_TOKEN }}
          ref: main
          path: runtime
          fetch-depth: 1
          persist-credentials: false

      - name: 🔑 Import Port runtime
        id: central
        shell: bash
        env:
          DEADZONE_PRIVATE_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash runtime/load-build.sh port_coloros

      - name: 🛡️ Validate Port engine runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          required=(
            DEADZONE_ENGINE_REPOSITORY
            PRIVATE_REPO_TOKEN
            RCLONE_REMOTE_NAME
            RCLONE_UPLOAD_DIR
            BUILD_PROGRESS_SECRET
          )
          for variable_name in "${required[@]}"; do
            [[ -n "${!variable_name:-}" ]] || {
              echo "Missing runtime value: $variable_name" >&2
              exit 1
            }
          done
          [[ "$DEADZONE_ENGINE_REPOSITORY" == "mohammedmezo99/DeadZone-ColorOS_Port" ]] || {
            echo "Unexpected Port engine: $DEADZONE_ENGINE_REPOSITORY" >&2
            exit 1
          }
          echo "::add-mask::$BUILD_PROGRESS_SECRET"
          echo "DEADZONE_EVENT_SECRET=$BUILD_PROGRESS_SECRET" >> "$GITHUB_ENV"

      - name: ⚡ Maximize build space
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          build-mount-path: ${{ github.workspace }}/toolbuild
          swap-size-mb: 1024
          # ── Why overprovision + BOTH reserves are required ────────────────
          #
          # This action does not add capacity: it repartitions the same disk
          # into an LVM volume and re-mounts the build directory there. It
          # fallocate()s TWO loop PV images:
          #
          #   /pv.img          sized from free space on /   minus root-reserve-mb
          #   /mnt/tmp-pv.img  sized from free space on /mnt minus temp-reserve-mb
          #
          # On a GitHub runner /mnt is NOT a separate filesystem, it is a
          # directory on /dev/root, so BOTH images are charged against the same
          # pool and each reserve applies to only one of them. Measured across
          # runs 36417133938 (reserve 512MB) and 36429113528 (reserve 20000MB):
          # the build volume came out at 102G and / ended at 100M free / 100%
          # full BOTH times. Raising root-reserve-mb alone changed nothing,
          # because the /mnt image is sized from the same free space and simply
          # takes whatever is left.
          #
          # overprovision-lvm makes the PV images sparse, so their full size
          # does not immediately consume root. That is what actually keeps the
          # runner writable; the reserves then bound how much of the real disk
          # the build may claim, leaving room for Java, gradle/pip caches, /tmp
          # and upload staging outside toolbuild.
          overprovision-lvm: "true"
          root-reserve-mb: 12000
          temp-reserve-mb: 12000
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-docker-images: "true"

      - name: 💾 Verify build storage
        shell: bash
        env:
          STOCK_ROM_URL: ${{ inputs.stock_rom_url }}
          PORT_ROM_URL: ${{ inputs.port_rom_url }}
        run: |
          set -Eeuo pipefail
          mount_path="$GITHUB_WORKSPACE/toolbuild"

          # ── Measured requirement, not an arbitrary constant ──────────────
          #
          # The ColorOS two-ROM build holds, at peak:
          #   stock ZIP + port ZIP + both extracted trees + reconstructed
          #   partition .img files + super.img workspace + final ZIP.
          #
          # Measured on run 36417133938: stock OTA ~7 GiB, ColorOS ota_full
          # ~10 GiB. Holding both ZIPs *and* both extracted trees *and* every
          # reconstructed image peaks near 68 GiB with no cleanup, which is
          # what exhausted the runner and produced the false "missing source"
          # cascade for my_stock / my_heytap / odm.
          #
          # Two hard constraints set this number:
          #
          #   1. The runner has 145 GiB total and ~86 GiB free before the
          #      space action runs. maximize-build-space does not add space,
          #      it repartitions that same disk, and root-reserve-mb is held
          #      back for the runner's own writes. So the build volume is
          #      roughly (86 - reserve) GiB -- it CANNOT be made arbitrarily
          #      large, which is why "just ask for more disk" is not an option.
          #   2. The engine now deletes each role archive the moment its
          #      extracted tree is materialised (cleanup_role_archive) and
          #      prunes .oplus-work per partition, plus the workflow reclaims
          #      the consumed source trees before packaging. That removes
          #      roughly the size of both archives from the sustained peak.
          #
          # 56 GiB is the cleaned peak plus headroom, and it fits inside the
          # ~64 GiB usable build volume that root-reserve-mb: 20000 yields.
          # Requesting the uncleaned 68 GiB would always fail the gate, so the
          # threshold and the cleanup strategy are deliberately coupled.
          required_kb=$((56 * 1024 * 1024))
          safety_label="56 GiB (cleaned 2-ROM ColorOS peak + super.img + packaging headroom)"

          available_kb="$(df -Pk "$mount_path" | awk 'NR == 2 {print $4}')"
          total_kb="$(df -Pk "$mount_path" | awk 'NR == 2 {print $2}')"
          root_avail_kb="$(df -Pk / | awk 'NR == 2 {print $4}')"
          mount_src="$(findmnt -n -o SOURCE --target "$mount_path" 2>/dev/null || echo unknown)"

          echo "::group::Build storage report"
          echo "  Mount path      : $mount_path"
          echo "  Mount source    : $mount_src"
          echo "  Volume total    : $((total_kb / 1024 / 1024)) GiB"
          echo "  Volume available: $((available_kb / 1024 / 1024)) GiB"
          echo "  Required        : $((required_kb / 1024 / 1024)) GiB"
          echo "  Rationale       : $safety_label"
          echo "  Root available  : $((root_avail_kb / 1024 / 1024)) GiB (runner + toolchains)"
          echo "  Stock ROM       : ${STOCK_ROM_URL%%\?*}"
          echo "  Port ROM        : ${PORT_ROM_URL%%\?*}"
          echo "::endgroup::"
          df -h "$mount_path"

          # ── The failure that actually happened in run 36417133938 ────────
          #
          # The build volume looked fine (102G) while / itself sat at
          # 100M / 100% full, because both loop PV images are charged to the
          # root filesystem. Everything that is NOT inside toolbuild then
          # fails to write: Java, gradle/pip caches, /tmp, rclone uploads.
          # That is the condition to catch here, before a multi-hour download.
          root_min_kb=$((3 * 1024 * 1024))
          if (( root_avail_kb < root_min_kb )); then
            {
              echo "::error title=Root filesystem exhausted::Cause: INSUFFICIENT_DISK_SPACE"
              echo "Root available: $((root_avail_kb / 1024 / 1024)) GiB"
              echo "Required: 3 GiB for toolchains, caches and uploads outside toolbuild"
              echo "maximize-build-space charged its loop PV images to /; raise root-reserve-mb."
            } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo "::error::Root filesystem has only $((root_avail_kb / 1024 / 1024)) GiB free after disk expansion; need 3 GiB for toolchains and uploads. Increase root-reserve-mb."
            df -h /
            exit 1
          fi

          if (( available_kb < required_kb )); then
            {
              echo "::error title=Insufficient build storage::Cause: INSUFFICIENT_DISK_SPACE"
              echo "Required: $((required_kb / 1024 / 1024)) GiB"
              echo "Available: $((available_kb / 1024 / 1024)) GiB"
              echo "Mount: $mount_src"
              echo "The ColorOS two-ROM reconstruction cannot complete without this headroom."
            } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo "::error::Insufficient build storage: need $((required_kb / 1024 / 1024)) GiB free before ROM extraction; available $((available_kb / 1024 / 1024)) GiB on $mount_src"
            exit 1
          fi

          # Persist the measured headroom so the engine can size its own
          # preflight against reality instead of a hard-coded guess.
          {
            echo "DEADZONE_STORAGE_AVAILABLE_KB=$available_kb"
            echo "DEADZONE_STORAGE_MOUNT=$mount_src"
          } >> "$GITHUB_ENV"
          echo "Build storage verified: $((available_kb / 1024 / 1024)) GiB free on $mount_src"

      - name: 📥 Checkout private Port engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ steps.central.outputs.engine_repository }}
          token: ${{ env.PRIVATE_REPO_TOKEN }}
          ref: main
          path: toolbuild
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: 📡 Report queued Port build
        working-directory: toolbuild
        env:
          DEADZONE_EVENT_SECRET: ${{ env.BUILD_PROGRESS_SECRET }}
        run: |
          python3 notify.py start "$DEADZONE_SOURCE_REPOSITORY" "$DEADZONE_STOCK_ROM_URL" port "$DEADZONE_BUILDER_NAME" "$DEADZONE_BUILDER_ID"

      - name: 🕒 Set Cairo timezone
        run: sudo timedatectl set-timezone Africa/Cairo

      - name: ☕ Prepare Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "17"

      - name: 🧰 Install Port dependencies
        working-directory: toolbuild
        run: |
          set -Eeuo pipefail
          sudo bash -Ee -o pipefail setup.sh

      - name: 🔧 Give Port tools permission
        working-directory: toolbuild
        run: sudo chmod 777 -R *

      - name: ☁️ Install central rclone config
        shell: bash
        working-directory: toolbuild
        run: |
          set -Eeuo pipefail
          source_file="$GITHUB_WORKSPACE/runtime/rclone.conf"
          target_file="$PWD/rclone.conf"
          [[ -s "$source_file" ]] || {
            echo "::error::Central rclone config missing or empty: $source_file"
            exit 1
          }
          install -m 600 "$source_file" "$target_file"
          if ! rclone --config="$target_file" listremotes | sed 's/:$//' | grep -Fxq "$RCLONE_REMOTE_NAME"; then
            echo "::error::Central rclone.conf does not define expected remote: ${RCLONE_REMOTE_NAME}"
            exit 1
          fi
          rclone version

      - name: 🔂 Build Stock + Port ROM
        working-directory: toolbuild
        env:
          DEADZONE_EVENT_SECRET: ${{ env.BUILD_PROGRESS_SECRET }}
        run: |
          set -Eeuo pipefail
          sudo -E bash build.sh \
            "$DEADZONE_STOCK_ROM_URL" \
            "$DEADZONE_PORT_ROM_URL" \
            "$DEADZONE_SOURCE_REPOSITORY" \
            port \
            "$DEADZONE_BUILDER_NAME" \
            "$DEADZONE_BUILDER_ID" \
            2>&1 | tee build_action.log

      - name: 🧹 Reclaim disk after reconstruction
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          # build.sh already deletes each role archive as soon as its extracted
          # tree is materialised. This is the workflow-level safety net for
          # whatever the engine could not release, and it runs before the
          # packaging stage so the final ZIP has room to be written.
          bash "$GITHUB_WORKSPACE/.github/scripts/runner-cleanup.sh" post-extract || true

      - name: 📊 Report storage + failure cause
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mount_path="$GITHUB_WORKSPACE/toolbuild"
          echo "::group::Storage report after reconstruction"
          df -h "$mount_path" || true
          echo "::endgroup::"

          if [[ -f "$GITHUB_WORKSPACE/toolbuild/.deadzone-failure-code" ]]; then
            code="$(tr -d '\r\n' < "$GITHUB_WORKSPACE/toolbuild/.deadzone-failure-code")"
            echo "DeadZone failure class: $code"
            case "$code" in
              storage_exhausted)
                echo "::error title=INSUFFICIENT_DISK_SPACE::The runner ran out of disk during partition reconstruction. The reported 'missing source' partitions were a consequence of storage exhaustion, not of an absent ROM."
                ;;
              partition_source_missing)
                echo "::error title=PARTITION_SOURCE_MISSING::A partition source is genuinely absent from the ROM package."
                ;;
            esac
            printf 'DEADZONE_ERROR_CODE=%s\n' "$code" >> "$GITHUB_ENV"
          else
            echo "No engine-level failure class recorded (build may have succeeded)."
          fi

      - name: 📦 Pack Port ROM
        working-directory: toolbuild
        env:
          DEADZONE_EVENT_SECRET: ${{ env.BUILD_PROGRESS_SECRET }}
        run: |
          set -Eeuo pipefail
          python3 notify.py pack "$DEADZONE_SOURCE_REPOSITORY" "$DEADZONE_STOCK_ROM_URL" port "$DEADZONE_BUILDER_NAME" "$DEADZONE_BUILDER_ID"
          sudo -E bash packROM.sh 2>&1 | tee -a build_action.log

      - name: 🗜️ Package and upload Google Drive
        working-directory: toolbuild
        env:
          DEADZONE_EVENT_SECRET: ${{ env.BUILD_PROGRESS_SECRET }}
        run: |
          set -Eeuo pipefail
          python3 notify.py upload "$DEADZONE_SOURCE_REPOSITORY" "$DEADZONE_STOCK_ROM_URL" port "$DEADZONE_BUILDER_NAME" "$DEADZONE_BUILDER_ID"

          echo "[PERF][BEFORE PACKAGE]"
          df -h / | tail -1 | awk '{print "  Root:", $4, "available"}'
          free -h | awk '/^Mem:/ {printf "  Memory: %s total, %s free\n", $2, $7}'
          nproc | xargs -I{} echo "  CPU cores: {}"

          set +e
          sudo -E bash bin/port/uploadROM.sh 2>&1 | tee -a build_action.log
          google_status=${PIPESTATUS[0]}
          set -e
          printf 'DEADZONE_GOOGLE_UPLOAD_STATUS=%s\n' "$google_status" >> "$GITHUB_ENV"

          mapfile -t final_zips < <(find "$PWD/out" -maxdepth 1 -type f -name 'DeadZone_ColorOSPort_*.zip' -print 2>/dev/null)
          if (( ${#final_zips[@]} != 1 )); then
            echo "::error::Expected exactly one preserved final Port ZIP; found ${#final_zips[@]}"
            exit 1
          fi

          final_zip="${final_zips[0]}"
          final_name="$(basename "$final_zip")"

          # NOTE: Engine's create_zip.py performs streaming integrity validation.
          # No duplicate workflow-level ZIP validation needed.

          final_size_bytes="$(stat -c '%s' "$final_zip")"
          final_size_human="$(python3 - "$final_size_bytes" <<'PY'
          import sys
          size = int(sys.argv[1])
          value = float(size)
          for unit in ("B", "KiB", "MiB", "GiB", "TiB"):
              if value < 1024 or unit == "TiB":
                  print(f"{size} B" if unit == "B" else f"{value:.2f} {unit}")
                  break
              value /= 1024
          PY
          )"
          printf 'DEADZONE_FILE_SIZE=%s\nDEADZONE_INTEGRITY_VERIFIED=1\nDEADZONE_RESULT_NAME=%s\n' \
            "$final_size_human" "$final_name" >> "$GITHUB_ENV"

          echo "[PERF] Final ZIP verified by engine streaming validation"
          echo "[PERF] File size: ${final_size_human}"

          # Post-package cleanup via centralized helper
          echo "[PERF][POST-PACKAGE] Running cleanup..."
          bash "$GITHUB_WORKSPACE/.github/scripts/runner-cleanup.sh" post-package || true

      - name: ⬆️ Upload SourceForge and PixelDrain
        working-directory: toolbuild
        env:
          SOURCEFORGE_SSH_PRIVATE_KEY: ${{ secrets.SOURCEFORGE_SSH_PRIVATE_KEY }}
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          set -Eeuo pipefail
          set -a
          # shellcheck disable=SC1091
          source "$GITHUB_WORKSPACE/runtime/upload.env"
          set +a

          required_mirror_values=(SOURCEFORGE_USERNAME SOURCEFORGE_PROJECT SOURCEFORGE_SSH_PRIVATE_KEY PIXELDRAIN_API_KEY)
          for variable_name in "${required_mirror_values[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Mirror runtime value is missing: ${variable_name}"
              exit 1
            fi
          done

          mapfile -t final_zips < <(find "$PWD/out" -maxdepth 1 -type f -name 'DeadZone_ColorOSPort_*.zip' -print 2>/dev/null)
          (( ${#final_zips[@]} == 1 )) || {
            echo "::error::Final Port ZIP is unavailable for mirror upload"
            exit 1
          }
          final_zip="${final_zips[0]}"
          final_name="$(basename "$final_zip")"

          stock_state="$PWD/build/.port_state/stock/ddevice"
          port_state="$PWD/build/.port_state/port/ddevice"
          codename="$(tr '[:lower:]' '[:upper:]' < "$stock_state/device_f.txt" | sed 's/ /_/g' | tr -cd 'A-Za-z0-9._+-')"
          rom_version="$(tr -d '\r\n' < "$port_state/base_rom_code.txt")"
          os_folder="ColorOS"

          google_status="${DEADZONE_GOOGLE_UPLOAD_STATUS:-1}"
          drive_url="${DEADZONE_GOOGLE_DRIVE_URL:-}"
          if (( google_status == 0 )) && [[ -z "$drive_url" ]]; then
            drive_remote="${RCLONE_REMOTE_NAME}:${RCLONE_UPLOAD_DIR%/}/Port/${codename}/${os_folder}/${final_name}"
            drive_url="$(rclone --config="$PWD/rclone.conf" link "$drive_remote" 2>/dev/null | tail -n1 | tr -d '\r' || true)"
            if [[ -n "$drive_url" ]]; then
              printf 'DEADZONE_GOOGLE_DRIVE_URL=%s\nDEADZONE_RESULT_URL=%s\n' "$drive_url" "$drive_url" >> "$GITHUB_ENV"
            fi
          fi

          if (( google_status == 0 )) && [[ -n "$drive_url" ]]; then
            export DEADZONE_SET_RESULT_URL=0
          else
            echo "::warning::Google Drive is unavailable as a final public link; secondary mirrors may rescue the release"
            export DEADZONE_SET_RESULT_URL=1
          fi

          set +e
          bash "$GITHUB_WORKSPACE/runtime/upload-mirrors.sh" \
            "Port" "$codename" "$os_folder" "$final_zip" "$final_name" \
            2>&1 | tee -a build_action.log
          mirror_status=${PIPESTATUS[0]}
          set -e

          if (( google_status != 0 && mirror_status != 0 )); then
            echo "::error::Google Drive and all secondary ROM mirrors failed"
            exit 1
          fi
          if (( mirror_status != 0 )); then
            echo "::warning::Secondary mirrors failed, but Google Drive upload succeeded"
          fi

      - name: ✅ Report successful Port build
        if: success()
        working-directory: toolbuild
        env:
          DEADZONE_EVENT_SECRET: ${{ env.BUILD_PROGRESS_SECRET }}
        run: |
          set -euo pipefail
          python3 notify.py success "$DEADZONE_SOURCE_REPOSITORY" "$DEADZONE_STOCK_ROM_URL" port "$DEADZONE_BUILDER_NAME" "$DEADZONE_BUILDER_ID"

      - name: 🌐 Publish Port release to website
        if: success()
        continue-on-error: true
        working-directory: toolbuild
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ -n "${DEADZONE_RESULT_NAME:-}" ]] || {
            echo "::warning::Website release skipped: final ZIP name is unavailable"
            exit 0
          }
          stock_state="$PWD/build/.port_state/stock/ddevice"
          port_state="$PWD/build/.port_state/port/ddevice"
          python3 "$GITHUB_WORKSPACE/runtime/publish-website-release.py" local \
            --request-id "$DEADZONE_REQUEST_ID" \
            --edition-version "$(tr -d '\r\n' < Version)" \
            --codename "$(tr -d '\r\n' < "$stock_state/device_f.txt")" \
            --rom-version "$(tr -d '\r\n' < "$port_state/base_rom_code.txt")" \
            --android-version "$(tr -d '\r\n' < "$port_state/androidver.txt")" \
            --region "$(tr -d '\r\n' < "$stock_state/device_type.txt")" \
            --filename "$DEADZONE_RESULT_NAME" \
            --artifact-path "$PWD/out/$DEADZONE_RESULT_NAME" \
            --google-drive-url "${DEADZONE_GOOGLE_DRIVE_URL:-}" \
            --sourceforge-url "${DEADZONE_SOURCEFORGE_URL:-}" \
            --pixeldrain-url "${DEADZONE_PIXELDRAIN_URL:-}"

      - name: ❌ Report failed Port build
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" && -s runtime/build.env ]]; then
            set -a
            # shellcheck disable=SC1091
            source runtime/build.env
            set +a
            export DEADZONE_EVENT_SECRET="${BUILD_PROGRESS_SECRET:-}"
          fi
          [[ -n "${DEADZONE_EVENT_SECRET:-}" ]] || {
            echo '::error::Terminal Port event cannot be signed because the central event secret is unavailable.'
            exit 1
          }
          python3 runtime/report_build_event.py failed \
            --project port_coloros \
            --message "Port ROM build failed."

      - name: ⛔ Report cancelled Port build
        if: cancelled()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" && -s runtime/build.env ]]; then
            set -a
            # shellcheck disable=SC1091
            source runtime/build.env
            set +a
            export DEADZONE_EVENT_SECRET="${BUILD_PROGRESS_SECRET:-}"
          fi
          [[ -n "${DEADZONE_EVENT_SECRET:-}" ]] || {
            echo '::error::Terminal Port event cannot be signed because the central event secret is unavailable.'
            exit 1
          }
          python3 runtime/report_build_event.py cancelled \
            --project port_coloros \
            --message "Port ROM build cancelled."

      - name: 🧹 Cleanup Port workspace
        if: always()
        run: |
          set -Eeuo pipefail
          echo "[CLEANUP] Running final Port workspace cleanup..."
          bash "$GITHUB_WORKSPACE/.github/scripts/runner-cleanup.sh" final || true
          rm -f toolbuild/rclone.conf
