name: Temporary Sync MIUI14 OS3_A15

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-sync-miui14-os3a15.yml"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source trees
        uses: actions/checkout@v4
        with:
          repository: mohammedmezo99/xiaomi_Lite
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: source
          fetch-depth: 1
          sparse-checkout: |
            mods/MIUI14
            mods/OS3_A15
          sparse-checkout-cone-mode: false

      - name: Checkout private Lite target
        uses: actions/checkout@v4
        with:
          repository: mohammedmezo99/DeadZone-xiaomi_Lite
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: target
          fetch-depth: 1

      - name: Copy exact trees and clean failed private workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e target/bin/modfile/MIUI14
          test ! -e target/bin/modfile/OS3_A15

          cp -a -- source/mods/MIUI14 target/bin/modfile/MIUI14
          cp -a -- source/mods/OS3_A15 target/bin/modfile/OS3_A15
          rm -f -- target/.github/workflows/temp-sync-miui14-os3a15.yml

          python3 - <<'PY'
          import hashlib
          import os
          import stat
          from pathlib import Path

          pairs = [
              (Path('source/mods/MIUI14'), Path('target/bin/modfile/MIUI14')),
              (Path('source/mods/OS3_A15'), Path('target/bin/modfile/OS3_A15')),
          ]

          def inventory(root):
              entries = {}
              for path in sorted(root.rglob('*')):
                  rel = path.relative_to(root).as_posix()
                  st = path.lstat()
                  if path.is_symlink():
                      entries[rel] = ('symlink', os.readlink(path), stat.S_IMODE(st.st_mode))
                  elif path.is_file():
                      entries[rel] = ('file', hashlib.sha256(path.read_bytes()).hexdigest(), stat.S_IMODE(st.st_mode))
                  elif path.is_dir():
                      entries[rel] = ('dir', None, None)
              return entries

          for src, dst in pairs:
              left = inventory(src)
              right = inventory(dst)
              if left != right:
                  raise SystemExit(f'tree mismatch before commit: {src.name}')
              files = sum(1 for item in left.values() if item[0] == 'file')
              links = sum(1 for item in left.values() if item[0] == 'symlink')
              print(f'{src.name}: {files} files, {links} symlinks — exact before commit')
          PY

      - name: Commit directly to Lite main
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bin/modfile/MIUI14 bin/modfile/OS3_A15 .github/workflows/temp-sync-miui14-os3a15.yml
          git status --short
          git commit -m "modfile: add MIUI14 and OS3_A15"
          git push origin HEAD:main

      - name: Verify exact Git trees after push
        shell: bash
        run: |
          set -Eeuo pipefail
          source_miui14=$(git -C source rev-parse HEAD:mods/MIUI14)
          source_os3=$(git -C source rev-parse HEAD:mods/OS3_A15)
          git -C target fetch origin main
          target_miui14=$(git -C target rev-parse origin/main:bin/modfile/MIUI14)
          target_os3=$(git -C target rev-parse origin/main:bin/modfile/OS3_A15)

          test "$source_miui14" = "$target_miui14"
          test "$source_os3" = "$target_os3"
          test ! -e target/.github/workflows/temp-sync-miui14-os3a15.yml

          echo "MIUI14 tree: $target_miui14"
          echo "OS3_A15 tree: $target_os3"
          echo "Exact Git-tree verification passed"
