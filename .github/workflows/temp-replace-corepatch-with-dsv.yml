name: Temporary Replace COREPATCH With DSV

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-replace-corepatch-with-dsv.yml"

permissions:
  contents: read

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout official Lite
        uses: actions/checkout@v4
        with:
          repository: mohammedmezo99/DeadZone-xiaomi_Lite
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: lite
          fetch-depth: 1

      - name: Replace COREPATCH with DSV
        working-directory: lite
        shell: bash
        run: |
          set -Eeuo pipefail

          test -d "bin/package/COREPATCH"
          test -d "bin/package/Disable Signature Verification"

          rm -rf -- "bin/package/COREPATCH"

          python3 - <<'PY'
          from pathlib import Path

          root = Path("bin/package/Disable Signature Verification")
          replacements = {
              '$work_dir/mods/Package/Disable Signature Verification': '$work_dir/bin/package/Disable Signature Verification',
              '$REPO_ROOT/scripts/core/functions.sh': '$REPO_ROOT/functions.sh',
              '$REPO_ROOT/tools/apktool': '$REPO_ROOT/bin/apktool',
              '$work_dir/scripts/core/functions.sh': '$work_dir/functions.sh',
              '$work_dir/build/.deadzone/state/androidver.txt': '$work_dir/bin/ddevice/androidver.txt',
          }
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in {'.sh', '.py'}:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='\n')
          PY

          cat > bin/package/patchpackage.sh <<'EOF'
          work_dir=$(pwd)
          source "$work_dir/functions.sh"

          mods "Add Package..."
          target_dir="$work_dir/bin/package"

          bash "$target_dir/Disable Signature Verification/update.sh"
          bash "$target_dir/DISABLE_AVB/DISABLEavb.sh"
          bash "$target_dir/KouseiPatcher/update.sh"
          bash "$target_dir/NOTIFICATION_FIX/notificationFIX.sh"
          bash "$target_dir/RefreshRate/1hz.sh"
          bash "$target_dir/ResetProp/update.sh"
          mods "Add Package Done"
          EOF

      - name: Validate replacement
        working-directory: lite
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e "bin/package/COREPATCH"
          test -f "bin/package/Disable Signature Verification/update.sh"
          grep -F 'bash "$target_dir/Disable Signature Verification/update.sh"' bin/package/patchpackage.sh
          ! grep -R -F 'COREPATCH' bin/package/patchpackage.sh "bin/package/Disable Signature Verification"
          ! grep -R -F '$work_dir/mods/Package/Disable Signature Verification' "bin/package/Disable Signature Verification"
          ! grep -R -F '$REPO_ROOT/scripts/core/functions.sh' "bin/package/Disable Signature Verification"
          ! grep -R -F '$REPO_ROOT/tools/apktool' "bin/package/Disable Signature Verification"
          ! grep -R -F '$work_dir/scripts/core/functions.sh' "bin/package/Disable Signature Verification"
          ! grep -R -F '$work_dir/build/.deadzone/state/androidver.txt' "bin/package/Disable Signature Verification"
          bash -n bin/package/patchpackage.sh
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find "bin/package/Disable Signature Verification" -type f -name '*.sh' -print0)
          test -f bin/apktool/baksmaliv2.jar
          test -f bin/apktool/smaliv2.jar
          echo "COREPATCH removed and DSV wired directly."

      - name: Commit replacement to target main
        working-directory: lite
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- bin/package
          echo "Changes to commit:"
          git diff --cached --name-status -- bin/package
          test -n "$(git diff --cached --name-only -- bin/package)"
          git commit -m "package: replace COREPATCH with Disable Signature Verification"
          git push origin HEAD:main
          echo "TARGET_COMMIT=$(git rev-parse HEAD)"

      - name: Verify clean target main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf verify
          git clone --depth=1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/mohammedmezo99/DeadZone-xiaomi_Lite.git" verify >/dev/null 2>&1
          cd verify
          test ! -e "bin/package/COREPATCH"
          test -f "bin/package/Disable Signature Verification/update.sh"
          grep -F 'bash "$target_dir/Disable Signature Verification/update.sh"' bin/package/patchpackage.sh
          ! grep -R -F 'COREPATCH' bin/package/patchpackage.sh "bin/package/Disable Signature Verification"
          bash -n bin/package/patchpackage.sh
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find "bin/package/Disable Signature Verification" -type f -name '*.sh' -print0)
          echo "Verified target main after push."
