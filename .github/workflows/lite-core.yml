name: MEZO-Lite Core

on:
  workflow_call:
    inputs:
      input_url:
        description: 📥 ROM download URL
        required: true
        type: string
      builder_name:
        description: 👤 Builder name
        required: false
        type: string
      builder_id:
        description: 💬 Telegram user ID
        required: false
        type: string
      request_id:
        description: 🆔 DeadZone controlled build request ID
        required: true
        type: string
      callback_url:
        description: 🔗 Signed DeadZone build-event endpoint
        required: true
        type: string
    secrets:
      GH_TOKEN:
        required: true
      SOURCEFORGE_SSH_PRIVATE_KEY:
        required: true
      PIXELDRAIN_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: 🛠️ Build ROM
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DEADZONE_REQUEST_ID: ${{ inputs.request_id }}
      DEADZONE_CALLBACK_URL: ${{ inputs.callback_url }}
      DEADZONE_PROJECT: lite
      DEADZONE_CONTROLLED_BUILD: "1"
      DEADZONE_INPUT_URL: ${{ inputs.input_url }}
      DEADZONE_BUILDER_NAME: ${{ inputs.builder_name }}
      DEADZONE_BUILDER_ID: ${{ inputs.builder_id }}
      DEADZONE_SOURCE_REPOSITORY: ${{ github.repository }}

    steps:
      - name: 🧾 Validate controlled request
        shell: python
        env:
          INPUT_URL: ${{ inputs.input_url }}
          REQUEST_ID: ${{ inputs.request_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          import os
          import re
          from urllib.parse import urlparse

          request_id = os.environ["REQUEST_ID"].strip()
          if not re.fullmatch(r"lite_[A-Za-z0-9]{8,80}", request_id):
              raise SystemExit("Invalid DeadZone request ID")

          for name in ("INPUT_URL", "CALLBACK_URL"):
              value = os.environ[name].strip()
              parsed = urlparse(value)
              if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
                  raise SystemExit(f"{name} must be a safe HTTPS URL")

      - name: 🔐 Validate launcher credentials
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SOURCEFORGE_SSH_PRIVATE_KEY: ${{ secrets.SOURCEFORGE_SSH_PRIVATE_KEY }}
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          set -euo pipefail
          required=(GH_TOKEN SOURCEFORGE_SSH_PRIVATE_KEY PIXELDRAIN_API_KEY)
          for variable_name in "${required[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Missing required repository secret: ${variable_name}"
              exit 1
            fi
          done

      - name: 📥 Checkout DeadZone launcher
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: 📥 Checkout private runtime
        uses: actions/checkout@v4
        with:
          repository: mohammedmezo99/DeadZone-File
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: runtime
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            projects.env
            build.env
            rclone.conf
            load-build.sh
            report_build_event.py
            upload.env
            upload-mirrors.sh
          sparse-checkout-cone-mode: false

      - name: ⚙️ Load central runtime
        id: runtime
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DEADZONE_CONTROLLED_BUILD: "1"
        run: |
          set -euo pipefail
          for runtime_file in projects.env build.env rclone.conf load-build.sh report_build_event.py upload.env upload-mirrors.sh; do
            if [[ ! -s "runtime/${runtime_file}" ]]; then
              echo "::error::Central runtime file is missing or empty: ${runtime_file}"
              exit 1
            fi
          done
          chmod 700 runtime/load-build.sh runtime/upload-mirrors.sh
          runtime/load-build.sh lite

      - name: ✅ Validate loaded runtime
        env:
          ENGINE_REPOSITORY: ${{ steps.runtime.outputs.engine_repository }}
        run: |
          set -euo pipefail
          required=(
            ENGINE_REPOSITORY
            DEADZONE_ENGINE_REPOSITORY
            BUILD_PROGRESS_SECRET
            RCLONE_REMOTE_NAME
            RCLONE_UPLOAD_DIR
          )
          for variable_name in "${required[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Central runtime value is missing: ${variable_name}"
              exit 1
            fi
          done
          if [[ "$ENGINE_REPOSITORY" != "mohammedmezo99/DeadZone-xiaomi_Lite" ]]; then
            echo "::error::Unexpected Lite engine: $ENGINE_REPOSITORY"
            exit 1
          fi
          if [[ "$ENGINE_REPOSITORY" != "$DEADZONE_ENGINE_REPOSITORY" ]]; then
            echo "::error::Runtime engine output does not match the loaded project map"
            exit 1
          fi
          printf '::add-mask::%s\n' "$BUILD_PROGRESS_SECRET"
          printf 'DEADZONE_EVENT_SECRET=%s\n' "$BUILD_PROGRESS_SECRET" >> "$GITHUB_ENV"
          printf 'RCLONE_CONFIG_BASE64=\n' >> "$GITHUB_ENV"

      - name: 💾 Maximize build space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c
        with:
          build-mount-path: ${{ github.workspace }}/toolbuild
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      - name: 🧹 Clean unused runner packages
        run: |
          set -euo pipefail
          docker image prune --all --force || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android || true
          sudo apt-get purge -y azure-cli "ghc*" "zulu*" "hhvm*" "llvm*" firefox "google*" "dotnet*" powershell "mysql*" "php*" || true
          sudo apt-get autoremove --purge -y || true
          sudo apt-get clean

      - name: 📦 Checkout private builder source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.runtime.outputs.engine_repository }}
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: toolbuild
          lfs: true
          fetch-depth: 1
          persist-credentials: false

      - name: 📣 Start live tracking
        working-directory: toolbuild
        run: |
          set -euo pipefail
          if ! python3 notify.py start "$DEADZONE_SOURCE_REPOSITORY" "$DEADZONE_INPUT_URL" "lite" "$DEADZONE_BUILDER_NAME" "$DEADZONE_BUILDER_ID"; then
            echo "::warning::Lite live tracking start event failed; continuing ROM build"
          fi

      - name: 🕒 Set Cairo timezone
        run: sudo timedatectl set-timezone Africa/Cairo

      - name: ☕ Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🧰 Install builder dependencies
        working-directory: toolbuild
        run: |
          set -Eeuo pipefail
          sudo bash -Ee -o pipefail setup.sh 2>&1 | tee setup_action.log
          sudo pip3 install --no-cache-dir requests 2>&1 | tee -a setup_action.log

      - name: 🔓 Grant builder permissions
        working-directory: toolbuild
        run: chmod -R u+rwX,go+rX .

      - name: ☁️ Install central Rclone configuration
        working-directory: toolbuild
        run: |
          set -euo pipefail
          source_file="$GITHUB_WORKSPACE/runtime/rclone.conf"
          target_file="$PWD/rclone.conf"

          if [[ ! -s "$source_file" ]]; then
            echo "::error::Central rclone.conf is missing or empty"
            exit 1
          fi

          install -m 600 "$source_file" "$target_file"

          if ! command -v rclone >/dev/null 2>&1; then
            echo "rclone was not installed by builder setup; installing fallback package"
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends rclone
          fi

          if ! rclone --config="$target_file" listremotes | sed 's/:$//' | grep -Fxq "$RCLONE_REMOTE_NAME"; then
            echo "::error::Central rclone.conf does not define expected remote: ${RCLONE_REMOTE_NAME}"
            exit 1
          fi

          rclone version
          echo "Rclone configuration installed for remote: ${RCLONE_REMOTE_NAME}"

      - name: 🚀 Build ROM
        working-directory: toolbuild
        run: |
          set -euo pipefail
          sudo -E bash build.sh "$DEADZONE_INPUT_URL" "$DEADZONE_SOURCE_REPOSITORY" "lite" "$DEADZONE_BUILDER_NAME" "$DEADZONE_BUILDER_ID" 2>&1 | tee build_action.log

      - name: 📦 Pack Super
        working-directory: toolbuild
        run: |
          set -euo pipefail
          if ! python3 notify.py pack "$DEADZONE_SOURCE_REPOSITORY" "$DEADZONE_INPUT_URL" "lite" "$DEADZONE_BUILDER_NAME" "$DEADZONE_BUILDER_ID"; then
            echo "::warning::Lite live tracking pack event failed; continuing ROM packaging"
          fi
          sudo -E bash packSuper.sh 2>&1 | tee -a build_action.log

      - name: 🗜️ Package Final ZIP
        working-directory: toolbuild
        env:
          SOURCEFORGE_SSH_PRIVATE_KEY: ${{ secrets.SOURCEFORGE_SSH_PRIVATE_KEY }}
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          set -Eeuo pipefail
          if ! python3 notify.py upload "$DEADZONE_SOURCE_REPOSITORY" "$DEADZONE_INPUT_URL" "lite" "$DEADZONE_BUILDER_NAME" "$DEADZONE_BUILDER_ID"; then
            echo "::warning::Lite live tracking upload event failed; continuing ROM upload"
          fi

          set -a
          # shellcheck disable=SC1091
          source "$GITHUB_WORKSPACE/runtime/upload.env"
          set +a

          required_mirror_values=(SOURCEFORGE_USERNAME SOURCEFORGE_PROJECT SOURCEFORGE_SSH_PRIVATE_KEY PIXELDRAIN_API_KEY)
          for variable_name in "${required_mirror_values[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Mirror runtime value is missing: ${variable_name}"
              exit 1
            fi
          done

          missing_packages=0
          for command_name in rsync sftp ssh-keyscan ssh-keygen curl; do
            command -v "$command_name" >/dev/null 2>&1 || missing_packages=1
          done
          if (( missing_packages != 0 )); then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends rsync openssh-client curl
          fi

          sudo -E bash packZIP.sh 2>&1 | tee -a build_action.log

      - name: ⬆️ Upload ROM mirrors
        working-directory: toolbuild
        env:
          SOURCEFORGE_SSH_PRIVATE_KEY: ${{ secrets.SOURCEFORGE_SSH_PRIVATE_KEY }}
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          set -Eeuo pipefail

          set -a
          # shellcheck disable=SC1091
          source "$GITHUB_WORKSPACE/runtime/upload.env"
          set +a

          set +e
          sudo -E bash uploadROM.sh 2>&1 | tee -a build_action.log
          google_status=${PIPESTATUS[0]}
          set -e

          mapfile -t final_zips < <(find "$PWD/out" -maxdepth 1 -type f -name 'DeadZone_Lite_*.zip' -print 2>/dev/null)
          if (( ${#final_zips[@]} != 1 )); then
            echo "::error::Expected exactly one preserved final Lite ZIP; found ${#final_zips[@]}"
            sudo rm -rf "$PWD/out" "$PWD/build"
            exit 1
          fi

          final_zip="${final_zips[0]}"
          final_name="$(basename "$final_zip")"

          if ! python3 -m zipfile -t "$final_zip" >/dev/null; then
            echo "::error::Final Lite ZIP failed archive integrity validation: ${final_name}"
            sudo rm -rf "$PWD/out" "$PWD/build"
            exit 1
          fi
          final_size_bytes="$(stat -c '%s' "$final_zip")"
          final_size_human="$(python3 - "$final_size_bytes" <<'PY'
          import sys
          size = int(sys.argv[1])
          value = float(size)
          for unit in ("B", "KiB", "MiB", "GiB", "TiB"):
              if value < 1024 or unit == "TiB":
                  print(f"{size} B" if unit == "B" else f"{value:.2f} {unit}")
                  break
              value /= 1024
          PY
          )"
          printf 'DEADZONE_FILE_SIZE=%s\nDEADZONE_INTEGRITY_VERIFIED=1\nDEADZONE_RESULT_NAME=%s\n' "$final_size_human" "$final_name" >> "$GITHUB_ENV"
          codename="$(tr '[:lower:]' '[:upper:]' < "$PWD/bin/ddevice/device_f.txt" | sed 's/ /_/g' | tr -cd 'A-Za-z0-9._+-')"
          rom_version="$(tr -d '\r\n' < "$PWD/bin/ddevice/base_rom_code.txt")"
          if [[ "$rom_version" =~ ^(OS[0-9]+) ]]; then
            os_folder="${BASH_REMATCH[1]}"
          elif [[ "$rom_version" =~ ^[Vv]([0-9]+) ]]; then
            os_folder="MIUI${BASH_REMATCH[1]}"
          else
            echo "::error::Unable to derive mirror OS folder from ROM version: ${rom_version}"
            sudo rm -rf "$PWD/out" "$PWD/build"
            exit 1
          fi

          if (( google_status == 0 )); then
            drive_remote="${RCLONE_REMOTE_NAME}:${RCLONE_UPLOAD_DIR%/}/Lite/${codename}/${os_folder}/${final_name}"
            drive_url="$(rclone --config="$PWD/rclone.conf" link "$drive_remote" 2>/dev/null | tail -n1 | tr -d '\r' || true)"
            if [[ -n "$drive_url" ]]; then
              printf 'DEADZONE_GOOGLE_DRIVE_URL=%s\n' "$drive_url" >> "$GITHUB_ENV"
            fi
            export DEADZONE_SET_RESULT_URL=0
          else
            echo "::warning::Google Drive upload did not complete; secondary mirrors will be allowed to rescue the release"
            export DEADZONE_SET_RESULT_URL=1
          fi

          set +e
          bash "$GITHUB_WORKSPACE/runtime/upload-mirrors.sh" \
            "Lite" "$codename" "$os_folder" "$final_zip" "$final_name" \
            2>&1 | tee -a build_action.log
          mirror_status=${PIPESTATUS[0]}
          set -e

          sudo rm -rf "$PWD/out" "$PWD/build"

          if (( google_status != 0 && mirror_status != 0 )); then
            echo "::error::Google Drive and all secondary ROM mirrors failed"
            exit 1
          fi
          if (( mirror_status != 0 )); then
            echo "::warning::Secondary mirrors failed, but Google Drive upload succeeded"
          fi

      - name: ✅ Send success notification
        if: success()
        working-directory: toolbuild
        run: |
          set -euo pipefail
          if ! python3 notify.py success "$DEADZONE_SOURCE_REPOSITORY" "$DEADZONE_INPUT_URL" "lite" "$DEADZONE_BUILDER_NAME" "$DEADZONE_BUILDER_ID"; then
            echo "::warning::Lite success live event failed; keeping successful ROM build"
          fi

      - name: 🌐 Publish Lite release to website
        if: success()
        continue-on-error: true
        working-directory: toolbuild
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -Eeuo pipefail
          website_url="${DEADZONE_GOOGLE_DRIVE_URL:-}"
          [[ -n "$website_url" ]] || website_url="${DEADZONE_SOURCEFORGE_URL:-}"
          [[ -n "$website_url" ]] || website_url="${DEADZONE_PIXELDRAIN_URL:-}"

          if [[ -z "$website_url" || "${DEADZONE_INTEGRITY_VERIFIED:-0}" != "1" || -z "${DEADZONE_FILE_SIZE:-}" || -z "${DEADZONE_RESULT_NAME:-}" ]]; then
            echo "::warning::Website release skipped: no successful download mirror or verified ZIP metadata is available"
            exit 0
          fi
          export DEADZONE_WEBSITE_DOWNLOAD_URL="$website_url"
          command -v gh >/dev/null 2>&1 || {
            echo "::warning::gh CLI is unavailable; website release skipped"
            exit 0
          }

          endpoint="/repos/mohammedmezo99/Deadzone/contents/src/data/published-builds.json"
          catalog="$RUNNER_TEMP/deadzone-published-builds.json"
          updater="$RUNNER_TEMP/deadzone-update-catalog.py"

          cat > "$updater" <<'PY'
          import json
          import os
          import re
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse

          def env(name):
              value = os.environ.get(name, "").strip()
              if not value:
                  raise SystemExit(f"Missing website release value: {name}")
              return value

          def text(path):
              value = Path(path).read_text(encoding="utf-8", errors="replace").strip()
              if not value:
                  raise SystemExit(f"Missing website release metadata: {path}")
              return value

          path = Path(sys.argv[1])
          catalog = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(catalog, list) or any(not isinstance(entry, dict) for entry in catalog):
              raise SystemExit("Website release catalog must be a JSON array of objects")

          codename = text("bin/ddevice/device_f.txt").lower()
          filename = env("DEADZONE_RESULT_NAME")
          download_url = env("DEADZONE_WEBSITE_DOWNLOAD_URL")
          parsed = urlparse(download_url)
          allowed_hosts = {"drive.google.com", "sourceforge.net", "pixeldrain.com"}
          if not re.fullmatch(r"[a-z0-9][a-z0-9_-]{1,39}", codename):
              raise SystemExit("Invalid website release codename")
          if not filename.lower().endswith(".zip") or "/" in filename or "\\" in filename:
              raise SystemExit("Invalid website release filename")
          if parsed.scheme != "https" or parsed.hostname not in allowed_hosts or parsed.username or parsed.password:
              raise SystemExit("Website release requires a safe supported download URL")

          release = {
              "id": env("DEADZONE_REQUEST_ID"),
              "project": "lite",
              "edition": "Lite",
              "editionVersion": text("Version"),
              "codename": codename,
              "romVersion": text("bin/ddevice/base_rom_code.txt"),
              "androidVersion": text("bin/ddevice/androidver.txt"),
              "region": text("bin/ddevice/device_type.txt"),
              "fileSize": env("DEADZONE_FILE_SIZE"),
              "filename": filename,
              "downloadUrl": download_url,
              "integrityVerified": True,
              "updatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "style": "Lite",
              "status": "Available",
          }

          def same(entry):
              return entry.get("id") == release["id"] or (
                  str(entry.get("codename", "")).lower(),
                  entry.get("edition") or entry.get("style"),
                  str(entry.get("filename", "")).lower(),
              ) == (
                  release["codename"],
                  release["edition"],
                  release["filename"].lower(),
              )

          path.write_text(
              json.dumps([release, *(entry for entry in catalog if not same(entry))], indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          for attempt in 1 2 3 4; do
            response="$(gh api "${endpoint}?ref=main")"
            sha="$(jq -r '.sha' <<< "$response")"
            jq -r '.content' <<< "$response" | tr -d '\n' | base64 -d > "$catalog"
            python3 "$updater" "$catalog"
            encoded="$(base64 -w0 "$catalog")"
            codename="$(tr '[:upper:]' '[:lower:]' < bin/ddevice/device_f.txt | tr -d '\r\n')"

            set +e
            gh_output="$(gh api --method PUT "$endpoint" \
              -f message="release: publish Lite ${codename} ${DEADZONE_RESULT_NAME}" \
              -f content="$encoded" \
              -f sha="$sha" \
              -f branch=main 2>&1)"
            gh_status=$?
            set -e

            if (( gh_status == 0 )); then
              echo "Website release catalog published successfully"
              exit 0
            fi
            if [[ "$gh_output" != *"HTTP 409"* && "$gh_output" != *"HTTP 422"* ]]; then
              echo "::error::Website release catalog update failed"
              printf '%s\n' "$gh_output"
              exit 1
            fi
            echo "::warning::Website catalog changed concurrently; retrying (${attempt}/4)"
            sleep "$attempt"
          done

          echo "::error::Website release catalog could not be published after retries"
          exit 1

      - name: ❌ Send failure notification
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" && -s runtime/build.env ]]; then
            set -a
            # shellcheck disable=SC1091
            source runtime/build.env
            set +a
            export DEADZONE_EVENT_SECRET="${BUILD_PROGRESS_SECRET:-}"
          fi
          [[ -n "${DEADZONE_EVENT_SECRET:-}" ]] || {
            echo '::error::Terminal Lite event cannot be signed because the central event secret is unavailable.'
            exit 1
          }
          python3 runtime/report_build_event.py failed \
            --project lite \
            --message "DeadZone Lite ROM build failed."

      - name: ⛔ Send cancellation notification
        if: cancelled()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${DEADZONE_EVENT_SECRET:-}" && -s runtime/build.env ]]; then
            set -a
            # shellcheck disable=SC1091
            source runtime/build.env
            set +a
            export DEADZONE_EVENT_SECRET="${BUILD_PROGRESS_SECRET:-}"
          fi
          [[ -n "${DEADZONE_EVENT_SECRET:-}" ]] || {
            echo '::error::Terminal Lite event cannot be signed because the central event secret is unavailable.'
            exit 1
          }
          python3 runtime/report_build_event.py cancelled \
            --project lite \
            --message "DeadZone Lite ROM build cancelled."

      - name: 🧽 Remove private runtime files
        if: always()
        run: |
          rm -rf runtime
          rm -f toolbuild/rclone.conf
