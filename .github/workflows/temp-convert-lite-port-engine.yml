name: Temporary Convert Lite Snapshot To Port Engine

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-convert-lite-port-engine.yml"

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: 044741cfd8239fefb5640dc7f72a486c20ac0d6e
    steps:
      - name: Checkout Port target
        uses: actions/checkout@v4
        with:
          repository: mohammedmezo99/DeadZone-xiaomi_Port
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: target
          fetch-depth: 1

      - name: Guard target head
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Convert engine to Port
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p bin/port

          cat > build.sh <<'BUILD_SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          stock_rom="${1:?Usage: build.sh <stock-rom> <port-rom> [repo] [prefix] [builder-name] [builder-id]}"
          port_rom="${2:?Usage: build.sh <stock-rom> <port-rom> [repo] [prefix] [builder-name] [builder-id]}"
          repo_name="${3:-${GITHUB_REPOSITORY:-local}}"
          prefix_id="${4:-port}"
          export builder_name="${5:-}"
          builder_id="${6:-}"
          work_dir="$(pwd)"
          source_url="$stock_rom"

          tools_dir="$work_dir/bin/$(uname)/$(uname -m)"
          export PATH="$tools_dir:$PATH"
          chmod -R u+rwX,go+rX "$work_dir/bin" 2>/dev/null || true
          source "$work_dir/functions.sh"

          check unzip aria2c 7z zip java zipalign python3 zstd bc xmlstarlet aapt

          runtime_files=(
              androidver.txt base_rom_code.txt device_code.txt device_f.txt device_type.txt
              fstype.txt name_devices.txt os_code.txt os_type.txt rom_os.txt romtype.txt sdkLevel.txt
          )

          clear_runtime_state() {
              local name
              for name in "${runtime_files[@]}"; do
                  rm -f "$work_dir/bin/ddevice/$name"
              done
          }

          snapshot_runtime_state() {
              local role="$1"
              local state_dir="$work_dir/build/.port_state/$role/ddevice"
              local name
              rm -rf "$state_dir"
              mkdir -p "$state_dir"
              for name in "${runtime_files[@]}"; do
                  [[ -f "$work_dir/bin/ddevice/$name" ]] && cp -f "$work_dir/bin/ddevice/$name" "$state_dir/$name"
              done
          }

          normalize_super_image() {
              local source_image="$1"
              local target_image="$2"
              if simg2img "$source_image" "$target_image" >/dev/null 2>&1; then
                  return 0
              fi
              cp -f "$source_image" "$target_image"
          }

          unpack_super_image() {
              local super_image="$1"
              local raw base
              local raw_names
              raw_names="$(python3 "$work_dir/bin/lpunpack.py" --info "$super_image" | awk '/super:/ {print $5}')"
              [[ -n "$raw_names" ]] || { error "No dynamic partitions found in super.img"; return 1; }
              super_list=""
              for raw in $raw_names; do
                  [[ "$raw" == *_b ]] && continue
                  base="${raw%_a}"
                  base="${base%_b}"
                  python3 "$work_dir/bin/lpunpack.py" -p "$raw" "$super_image" "$work_dir/build/baserom/images" >/dev/null 2>&1
                  [[ "$raw" == "$base" ]] || mv -f "$work_dir/build/baserom/images/$raw.img" "$work_dir/build/baserom/images/$base.img"
                  super_list+="$base "
              done
          }

          extract_role() {
              local role="$1"
              local input_rom="$2"
              local baserom="$input_rom"
              local baserom_type=""
              local super_list=""
              local op_list br_root part fastboot_root source_images source_super
              local -a super_chunks=()

              rm -rf "$work_dir/build/baserom"
              mkdir -p "$work_dir/build/baserom/images"
              clear_runtime_state

              source "$work_dir/bin/ddevice/getROM.sh" "$baserom"
              [[ -s "$baserom" ]] || { error "${role^} ROM archive is missing after download"; return 1; }

              if unzip -Z1 "$baserom" | grep -qE '(^|/)payload\.bin$'; then
                  baserom_type="payload"
                  echo "$baserom_type" > "$work_dir/bin/ddevice/romtype.txt"
                  unpack "${role^}: found payload.bin"
                  unzip -p "$baserom" "$(unzip -Z1 "$baserom" | awk '$0 ~ /(^|\/)payload\.bin$/ {print; exit}')" > "$work_dir/build/baserom/payload.bin"
                  payload-extract extract -o "$work_dir/build/baserom/images" "$work_dir/build/baserom/payload.bin" >/dev/null 2>&1
                  super_list="vendor mi_ext odm odm_dlkm system system_dlkm vendor_dlkm product product_dlkm system_ext"
              elif unzip -Z1 "$baserom" | grep -q '\.new\.dat\.br$'; then
                  baserom_type="br"
                  echo "$baserom_type" > "$work_dir/bin/ddevice/romtype.txt"
                  unpack "${role^}: found Brotli dynamic partitions"
                  unzip -q "$baserom" -d "$work_dir/build/baserom"
                  op_list="$(find "$work_dir/build/baserom" -type f -name dynamic_partitions_op_list -print -quit)"
                  [[ -n "$op_list" ]] || { error "${role^}: dynamic_partitions_op_list is missing"; return 1; }
                  br_root="$(dirname "$op_list")"
                  super_list="$(awk '$1 == "add" {print $2}' "$op_list")"
                  for part in $super_list; do
                      brotli -d "$br_root/$part.new.dat.br" >/dev/null 2>&1
                      python3 "$work_dir/bin/Linux/x86_64/sdat2img.py" \
                          "$br_root/$part.transfer.list" "$br_root/$part.new.dat" \
                          "$work_dir/build/baserom/images/$part.img" >/dev/null 2>&1
                  done
                  if [[ "$br_root" != "$work_dir/build/baserom" && -d "$br_root/firmware-update" ]]; then
                      mv "$br_root/firmware-update" "$work_dir/build/baserom/"
                  fi
              elif unzip -Z1 "$baserom" | grep -qE '(^|/)images/super\.img(\.[0-9]+)?$'; then
                  baserom_type="fastboot-super"
                  echo "$baserom_type" > "$work_dir/bin/ddevice/romtype.txt"
                  unpack "${role^}: found Fastboot/Super ROM"
                  fastboot_root="$work_dir/build/baserom/fastboot-source"
                  mkdir -p "$fastboot_root"
                  unzip -q "$baserom" -d "$fastboot_root"
                  source_images="$(find "$fastboot_root" -type d -name images -print -quit)"
                  [[ -n "$source_images" ]] || { error "${role^}: Fastboot images directory is missing"; return 1; }
                  cp -a "$source_images/." "$work_dir/build/baserom/images/"
                  mapfile -t super_chunks < <(find "$work_dir/build/baserom/images" -maxdepth 1 -type f -name 'super.img.*' | sort -V)
                  if (( ${#super_chunks[@]} > 0 )); then
                      simg2img "${super_chunks[@]}" "$work_dir/build/baserom/super.img"
                  elif [[ -s "$work_dir/build/baserom/images/super.img" ]]; then
                      source_super="$work_dir/build/baserom/images/super.img"
                      normalize_super_image "$source_super" "$work_dir/build/baserom/super.img"
                  else
                      error "${role^}: super.img is missing"
                      return 1
                  fi
                  rm -f "$work_dir/build/baserom/images"/super.img*
                  unpack_super_image "$work_dir/build/baserom/super.img"
                  rm -rf "$fastboot_root"
              else
                  error "${role^}: unsupported ROM package"
                  return 1
              fi

              [[ -n "$super_list" ]] || { error "${role^}: no dynamic partitions detected"; return 1; }
              for part in $super_list; do
                  [[ -f "$work_dir/build/baserom/images/$part.img" ]] || continue
                  extract_partition "$work_dir/build/baserom/images/$part.img" "$work_dir/build/baserom/images"
              done

              echo "$device_f" > "$work_dir/bin/ddevice/device_f.txt"
              bash "$work_dir/bin/ddevice/fetchINFO.sh"
              snapshot_runtime_state "$role"

              rm -f "$work_dir/build/baserom/payload.bin" "$work_dir/build/baserom/super.img"
              rm -rf "$work_dir/build/${role}rom"
              mv "$work_dir/build/baserom" "$work_dir/build/${role}rom"

              if [[ "$input_rom" =~ ^https?:// ]]; then
                  rm -f "$work_dir/$baserom" 2>/dev/null || true
              fi
          }

          copy_state_required() {
              local role="$1" name="$2"
              local source_file="$work_dir/build/.port_state/$role/ddevice/$name"
              [[ -s "$source_file" ]] || { error "Missing ${role^} metadata: $name"; return 1; }
              cp -f "$source_file" "$work_dir/bin/ddevice/$name"
          }

          finalize_runtime_state() {
              local name
              clear_runtime_state
              for name in device_f.txt device_code.txt device_type.txt name_devices.txt romtype.txt; do
                  copy_state_required stock "$name"
              done
              for name in base_rom_code.txt os_code.txt rom_os.txt os_type.txt androidver.txt sdkLevel.txt; do
                  copy_state_required port "$name"
              done

              local stock_fs port_fs
              stock_fs="$(tr -d '\r\n' < "$work_dir/build/.port_state/stock/ddevice/fstype.txt")"
              port_fs="$(tr -d '\r\n' < "$work_dir/build/.port_state/port/ddevice/fstype.txt")"
              [[ -n "$stock_fs" && "$stock_fs" == "$port_fs" ]] || {
                  error "Stock/Port filesystem policy differs ($stock_fs vs $port_fs); mixed repacking is not supported by this Lite-derived packer"
                  return 1
              }
              printf '%s\n' "$port_fs" > "$work_dir/bin/ddevice/fstype.txt"
              cp -f "$work_dir/bin/ddevice/device_f.txt" "$work_dir/bin/script2flash/META-INF/CNAME"
          }

          rm -rf "$work_dir/out" "$work_dir/build"
          mkdir -p "$work_dir/build/.port_state"

          python3 "$work_dir/notify.py" download "$repo_name" "$source_url" "$prefix_id" "$builder_name" "$builder_id"
          unpack "Preparing Stock ROM"
          extract_role stock "$stock_rom"

          python3 "$work_dir/notify.py" unpack "$repo_name" "$source_url" "$prefix_id" "$builder_name" "$builder_id"
          unpack "Preparing Port ROM"
          extract_role port "$port_rom"

          stock_android="$(tr -d '\r\n' < "$work_dir/build/.port_state/stock/ddevice/androidver.txt")"
          port_android="$(tr -d '\r\n' < "$work_dir/build/.port_state/port/ddevice/androidver.txt")"
          [[ -n "$stock_android" && "$stock_android" == "$port_android" ]] || {
              error "Android version mismatch: Stock=$stock_android Port=$port_android"
              exit 1
          }

          mods "Merging Stock compatibility with Port software"
          bash "$work_dir/bin/port/merge.sh"
          finalize_runtime_state

          python3 "$work_dir/notify.py" build "$repo_name" "$source_url" "$prefix_id" "$builder_name" "$builder_id"

          bash "$work_dir/bin/ddevice/DEBLOAT/debloat.sh"
          bash "$work_dir/bin/modfile/Universal/insfile.sh"
          bash "$work_dir/bin/modfile/UpdateFile/insupdate.sh"
          bash "$work_dir/bin/package/patchpackage.sh"

          find "$work_dir/build/baserom/images" -exec touch -t 200901010000.00 {} + 2>/dev/null || true
          info "DeadZone Port modifications completed"
          BUILD_SH

          cat > bin/port/merge.sh <<'MERGE_SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          work_dir="$(pwd)"
          stock_root="$work_dir/build/stockrom"
          port_root="$work_dir/build/portrom"
          final_root="$work_dir/build/baserom"
          stock_images="$stock_root/images"
          port_images="$port_root/images"
          final_images="$final_root/images"
          state_root="$work_dir/build/.port_state"
          source "$work_dir/functions.sh"

          require_dir() {
              local path="$1" label="$2"
              [[ -d "$path" ]] || { error "$label is missing: $path"; return 1; }
          }

          copy_partition_metadata() {
              local source_images="$1" part="$2"
              local source_config="$source_images/config"
              local target_config="$final_images/config"
              local required
              mkdir -p "$target_config"
              for required in "${part}_fs_config" "${part}_file_contexts"; do
                  [[ -s "$source_config/$required" ]] || {
                      error "Missing packing metadata for $part: $source_config/$required"
                      return 1
                  }
              done
              find "$source_config" -maxdepth 1 -type f -name "${part}_*" -exec cp -f {} "$target_config/" \;
          }

          move_partition() {
              local source_images="$1" part="$2" required="${3:-false}"
              if [[ ! -d "$source_images/$part" ]]; then
                  [[ "$required" == true ]] && { error "Required partition is missing: $part"; return 1; }
                  return 0
              fi
              copy_partition_metadata "$source_images" "$part"
              rm -rf "$final_images/$part"
              mv "$source_images/$part" "$final_images/$part"
          }

          copy_tree_if_present() {
              local source_dir="$1" target_dir="$2" label="$3"
              [[ -d "$source_dir" ]] || { warn "$label not present in Stock ROM"; return 0; }
              mkdir -p "$target_dir"
              cp -a "$source_dir/." "$target_dir/"
              mods "$label applied from Stock ROM"
          }

          copy_stock_device_features() {
              local codename source_dir target_dir source_file base copied=0
              codename="$(tr -d '\r\n' < "$state_root/stock/ddevice/device_f.txt")"
              source_dir="$stock_images/product/etc/device_features"
              target_dir="$final_images/product/etc/device_features"
              [[ -d "$source_dir" ]] || { warn "Stock device_features not present"; return 0; }
              mkdir -p "$target_dir"
              shopt -s nullglob
              for source_file in "$source_dir"/*.xml; do
                  base="$(basename "$source_file" .xml)"
                  if [[ "$base" == "$codename" || "$base" == "$codename"* || "$codename" == "$base"* ]]; then
                      cp -f "$source_file" "$target_dir/$(basename "$source_file")"
                      copied=$((copied + 1))
                  fi
              done
              shopt -u nullglob
              (( copied > 0 )) && mods "Stock device_features applied for $codename" || warn "No Stock device_features matched $codename"
          }

          copy_stock_overlay() {
              local filename="$1" source_file target_dir
              source_file="$(find "$stock_images/product/overlay" -maxdepth 1 -type f -iname "$filename" -print -quit 2>/dev/null || true)"
              [[ -n "$source_file" ]] || { warn "Stock overlay not present: $filename"; return 0; }
              target_dir="$final_images/product/overlay"
              mkdir -p "$target_dir"
              cp -f "$source_file" "$target_dir/$(basename "$source_file")"
          }

          copy_hyperos_compatibility() {
              local generation
              generation="$(tr -d '\r\n' < "$state_root/port/ddevice/rom_os.txt")"
              [[ "$generation" == OS1 || "$generation" == OS2 || "$generation" == OS3 || "$generation" == OS4 ]] || return 0

              copy_stock_overlay AospFrameworkResOverlay.apk
              copy_stock_overlay DevicesAndroidOverlay.apk
              copy_stock_overlay DevicesOverlay.apk
              copy_stock_overlay MiuiFrameworkResOverlay.apk

              if [[ -f "$stock_images/product/priv-app/MiuiCamera/MiuiCamera.apk" ]]; then
                  mkdir -p "$final_images/product/priv-app/MiuiCamera"
                  cp -f "$stock_images/product/priv-app/MiuiCamera/MiuiCamera.apk" "$final_images/product/priv-app/MiuiCamera/MiuiCamera.apk"
                  mods "Stock MiuiCamera applied"
              else
                  warn "Stock MiuiCamera.apk not present"
              fi

              if [[ -f "$stock_images/product/app/Biometric/Biometric.apk" ]]; then
                  mkdir -p "$final_images/product/app/Biometric"
                  cp -f "$stock_images/product/app/Biometric/Biometric.apk" "$final_images/product/app/Biometric/Biometric.apk"
                  mods "Stock Biometric applied"
              elif [[ -f "$stock_images/product/app/MiuiBiometric/MiuiBiometric.apk" ]]; then
                  mkdir -p "$final_images/product/app/MiuiBiometric"
                  cp -f "$stock_images/product/app/MiuiBiometric/MiuiBiometric.apk" "$final_images/product/app/MiuiBiometric/MiuiBiometric.apk"
                  mods "Stock MiuiBiometric applied"
              else
                  warn "Stock biometric APK not present"
              fi

              if [[ -f "$stock_images/system_ext/apex/com.android.vndk.v33.apex" ]]; then
                  mkdir -p "$final_images/system_ext/apex"
                  cp -f "$stock_images/system_ext/apex/com.android.vndk.v33.apex" "$final_images/system_ext/apex/com.android.vndk.v33.apex"
                  mods "Stock com.android.vndk.v33.apex applied"
              fi
          }

          require_dir "$stock_images" "Stock images"
          require_dir "$port_images" "Port images"
          require_dir "$port_images/system" "Port system partition"
          require_dir "$port_images/system_ext" "Port system_ext partition"
          require_dir "$port_images/product" "Port product partition"
          require_dir "$stock_images/vendor" "Stock vendor partition"
          require_dir "$stock_images/odm" "Stock odm partition"

          port_generation="$(tr -d '\r\n' < "$state_root/port/ddevice/rom_os.txt")"
          if [[ "$port_generation" != MIUI ]]; then
              require_dir "$port_images/mi_ext" "Port mi_ext partition"
          fi

          rm -rf "$final_root"
          mkdir -p "$final_images"

          move_partition "$port_images" system true
          move_partition "$port_images" system_ext true
          move_partition "$port_images" product true
          move_partition "$port_images" mi_ext "$([[ "$port_generation" != MIUI ]] && echo true || echo false)"

          move_partition "$stock_images" vendor true
          move_partition "$stock_images" odm true
          move_partition "$stock_images" vendor_dlkm false
          move_partition "$stock_images" odm_dlkm false
          move_partition "$stock_images" system_dlkm false
          move_partition "$stock_images" product_dlkm false

          find "$stock_images" -maxdepth 1 -type f -exec mv -f {} "$final_images/" \;
          [[ -d "$stock_root/firmware-update" ]] && mv "$stock_root/firmware-update" "$final_root/" || true

          copy_tree_if_present "$stock_images/product/etc/displayconfig" "$final_images/product/etc/displayconfig" "Stock displayconfig"
          copy_stock_device_features
          copy_hyperos_compatibility

          mods "Stock + Port partition merge completed"
          rm -rf "$stock_root" "$port_root"
          MERGE_SH

          cp uploadROM.sh bin/port/uploadROM.sh
          python3 - <<'PY'
          from pathlib import Path

          path = Path('bin/port/uploadROM.sh')
          text = path.read_text()
          replacements = {
              'Missing Lite runtime state': 'Missing Port runtime state',
              'DeadZone_Lite_V${version_number}_': 'DeadZone_Port_V${version_number}_',
              'Final Lite ZIP was not created': 'Final Port ZIP was not created',
              'Final Lite ZIP failed integrity validation': 'Final Port ZIP failed integrity validation',
              '${RCLONE_UPLOAD_DIR%/}/Lite/${codename_upper}/${os_folder}/${final_name}': '${RCLONE_UPLOAD_DIR%/}/Port/${codename_upper}/${os_folder}/${final_name}',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing uploadROM replacement anchor: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

          cat > uploadROM.sh <<'UPLOAD_WRAPPER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          repo_root="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$repo_root"
          exec bash "$repo_root/bin/port/uploadROM.sh" "$@"
          UPLOAD_WRAPPER

          cat > setup.sh <<'SETUP_SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
              aria2 \
              p7zip-full \
              zip \
              unzip \
              rclone \
              python3 \
              python3-pip \
              zstd \
              bc \
              xmlstarlet \
              aapt \
              zipalign \
              android-sdk-libsparse-utils \
              erofs-utils \
              brotli

          chmod -R u+rwX,go+rX bin
          SETUP_SH

          python3 - <<'PY'
          from pathlib import Path

          path = Path('notify.py')
          text = path.read_text()
          replacements = {
              'Applying DeadZone Lite modifications': 'Applying DeadZone Port modifications',
              'r"lite_[A-Za-z0-9]{8,80}"': 'r"port_[A-Za-z0-9]{8,80}"',
              '"project": "lite"': '"project": "port"',
              '"User-Agent": "DeadZone-xiaomi-Lite"': '"User-Agent": "DeadZone-xiaomi-Port"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing notify replacement anchor: {old}')
              text = text.replace(old, new)

          marker = '\n\ndef _rom_properties() -> dict[str, str]:\n'
          if marker not in text:
              raise SystemExit('notify metadata insertion anchor missing')
          port_metadata = r'''

          def _port_release_metadata() -> dict[str, str]:
              state_root = Path("build/.port_state")
              fields: dict[str, str] = {}
              for role in ("stock", "port"):
                  root = state_root / role / "ddevice"
                  mapping = {
                      f"{role}_device_name": root / "name_devices.txt",
                      f"{role}_codename": root / "device_f.txt",
                      f"{role}_rom_version": root / "base_rom_code.txt",
                      f"{role}_android_version": root / "androidver.txt",
                  }
                  for field, value_path in mapping.items():
                      value = _read_first(str(value_path))
                      if value:
                          fields[field] = value[:120]
                  region = _normalized_region(_read_first(str(root / "device_type.txt")))
                  if region:
                      fields[f"{role}_region"] = region[:100]
              return fields
          '''
          text = text.replace(marker, port_metadata + marker, 1)

          payload_anchor = '        **_release_metadata(),\n'
          if payload_anchor not in text:
              raise SystemExit('notify payload metadata anchor missing')
          text = text.replace(payload_anchor, payload_anchor + '        **_port_release_metadata(),\n', 1)
          path.write_text(text)
          PY

          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.MD')
          text = path.read_text(errors='replace')
          for old, new in (
              ('DeadZone-xiaomi_Lite', 'DeadZone-xiaomi_Port'),
              ('DeadZone-xiaomi-Lite', 'DeadZone-xiaomi-Port'),
              ('DeadZone_Lite', 'DeadZone_Port'),
              ('DeadZone Lite', 'DeadZone Port'),
          ):
              text = text.replace(old, new)
          path.write_text(text)
          PY

          cat > .github/workflows/build.yml <<'MANUAL_YML'
          name: DeadZone Port ROM Build

          on:
            workflow_dispatch:
              inputs:
                stock_rom_url:
                  description: Stock ROM HTTPS URL
                  required: true
                port_rom_url:
                  description: Port ROM HTTPS URL
                  required: true
                builder_name:
                  description: Builder name
                  required: false
                builder_id:
                  description: Builder ID
                  required: false

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Maximize build space
                  uses: easimon/maximize-build-space@master
                  with:
                    swap-size-mb: 1024
                    root-reserve-mb: 512
                    remove-dotnet: 'true'
                    remove-android: 'true'
                    remove-haskell: 'true'

                - name: Checkout Port engine
                  uses: actions/checkout@v4

                - name: Prepare Java 17
                  uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'

                - name: Install Port dependencies
                  run: sudo bash -Ee -o pipefail setup.sh

                - name: Build Stock + Port ROM
                  run: |
                    sudo -E bash build.sh \
                      "${{ inputs.stock_rom_url }}" \
                      "${{ inputs.port_rom_url }}" \
                      "${{ github.repository }}" \
                      port \
                      "${{ inputs.builder_name }}" \
                      "${{ inputs.builder_id }}"

                - name: Pack Port ROM
                  run: sudo -E bash packROM.sh

                - name: Set up Rclone
                  if: ${{ secrets.GH_TOKEN != '' && secrets.GH_REPO != '' && secrets.RCLONE_TOKEN_PATH != '' }}
                  run: sudo -E bash uploadROM.sh setup "${{ secrets.GH_TOKEN }}" "${{ secrets.GH_REPO }}" "${{ secrets.RCLONE_TOKEN_PATH }}"

                - name: Upload Port ROM
                  if: ${{ secrets.GH_TOKEN != '' && secrets.GH_REPO != '' && secrets.RCLONE_TOKEN_PATH != '' }}
                  run: sudo -E bash uploadROM.sh
          MANUAL_YML

          chmod +x build.sh setup.sh uploadROM.sh bin/port/merge.sh bin/port/uploadROM.sh

      - name: Validate Port conversion
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n build.sh
          bash -n setup.sh
          bash -n uploadROM.sh
          bash -n bin/port/merge.sh
          bash -n bin/port/uploadROM.sh
          python3 -m py_compile notify.py

          grep -Fq 'DeadZone_Port_V${version_number}_${codename_upper}_${rom_version_component}_${region_component}-A${android_digits}.zip' bin/port/uploadROM.sh
          grep -Fq '${RCLONE_UPLOAD_DIR%/}/Port/${codename_upper}/${os_folder}/${final_name}' bin/port/uploadROM.sh
          grep -Fq 'r"port_[A-Za-z0-9]{8,80}"' notify.py
          grep -Fq '"project": "port"' notify.py
          grep -Fq 'DeadZone-xiaomi-Port' notify.py
          grep -Fq 'stock_device_name' notify.py
          grep -Fq 'port_device_name' notify.py

          rm -rf build
          mkdir -p build/stockrom/images/config build/portrom/images/config build/.port_state/stock/ddevice build/.port_state/port/ddevice
          printf 'garnet\n' > build/.port_state/stock/ddevice/device_f.txt
          printf 'OS2\n' > build/.port_state/port/ddevice/rom_os.txt
          printf 'STOCK\n' > build/stockrom/images/boot.img

          for part in vendor odm; do
            mkdir -p "build/stockrom/images/$part"
            printf 'stock-%s\n' "$part" > "build/stockrom/images/$part/source.txt"
            printf '/ 0 0 0755\n' > "build/stockrom/images/config/${part}_fs_config"
            printf '/ u:object_r:system_file:s0\n' > "build/stockrom/images/config/${part}_file_contexts"
          done
          mkdir -p build/stockrom/images/product/etc/displayconfig
          printf 'stock-display\n' > build/stockrom/images/product/etc/displayconfig/test.xml

          for part in system system_ext product mi_ext; do
            mkdir -p "build/portrom/images/$part"
            printf 'port-%s\n' "$part" > "build/portrom/images/$part/source.txt"
            printf '/ 0 0 0755\n' > "build/portrom/images/config/${part}_fs_config"
            printf '/ u:object_r:system_file:s0\n' > "build/portrom/images/config/${part}_file_contexts"
          done

          bash bin/port/merge.sh
          test "$(cat build/baserom/images/system/source.txt)" = 'port-system'
          test "$(cat build/baserom/images/product/source.txt)" = 'port-product'
          test "$(cat build/baserom/images/vendor/source.txt)" = 'stock-vendor'
          test "$(cat build/baserom/images/odm/source.txt)" = 'stock-odm'
          test "$(cat build/baserom/images/boot.img)" = 'STOCK'
          test "$(cat build/baserom/images/product/etc/displayconfig/test.xml)" = 'stock-display'
          rm -rf build __pycache__

          git diff --check -- build.sh notify.py uploadROM.sh setup.sh bin/port/merge.sh bin/port/uploadROM.sh .github/workflows/build.yml README.MD

      - name: Commit conversion to Port main
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- build.sh notify.py uploadROM.sh setup.sh bin/port/merge.sh bin/port/uploadROM.sh .github/workflows/build.yml README.MD
          git diff --cached --stat
          git commit -m "port: convert Lite snapshot into Port engine"
          git push origin HEAD:main

      - name: Verify Port main after push
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf verify
          git clone --depth=1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/mohammedmezo99/DeadZone-xiaomi_Port.git" verify
          cd verify
          bash -n build.sh
          bash -n bin/port/merge.sh
          bash -n bin/port/uploadROM.sh
          python3 -m py_compile notify.py
          grep -Fq 'DeadZone_Port_V${version_number}_' bin/port/uploadROM.sh
          grep -Fq '/Port/${codename_upper}/${os_folder}/${final_name}' bin/port/uploadROM.sh
          grep -Fq '"project": "port"' notify.py
          test -x setup.sh
          echo "Port engine verification passed"
