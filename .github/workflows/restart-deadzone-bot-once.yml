name: Restart DeadZone Bot Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restart-deadzone-bot-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: 🚀 Dispatch official bot deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🚀 Restart DeadZone Bot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh workflow run deploy-bot.yml --repo "$GITHUB_REPOSITORY" --ref main
