name: Trigger DeadZone EXE

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-deadzone-exe.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: startsWith(github.event.head_commit.message, 'Trigger DeadZone EXE build')
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Dispatch DeadZone_exe
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deadzone-exe.yml/dispatches \
            -d '{"ref":"main"}'
