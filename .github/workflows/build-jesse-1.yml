name: MEZO-Jesse 1

run-name: 🚀 MEZO-Jesse 1 · ${{ inputs.request_id }} · ${{ inputs.builder_name || github.actor }}

concurrency:
  group: mezo-jesse-build-1
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 📥 Firmware URL or local-relative path
        required: true
        type: string
      build_name:
        description: 🏷️ Build name (becomes out/<build_name>/)
        required: true
        type: string
      rom_type:
        description: 🧩 ROM type passed to Jesse's --type flag
        required: false
        type: string
        default: auto
      compress:
        description: 🗜️ Also produce a .zip alongside the .img (Jesse --compress)
        required: false
        type: boolean
        default: true
      no_debloat:
        description: 🚫 Skip the debloat patch set (Jesse --no-debloat)
        required: false
        type: boolean
        default: false
      avb_key:
        description: 🔐 RSA private key (PEM) for AVB signing (empty = AOSP test key)
        required: false
        type: string
        default: ''
      builder_name:
        description: 👤 Builder name
        required: false
        type: string
      builder_id:
        description: 💬 Telegram user ID
        required: false
        type: string
      request_id:
        description: 🆔 DeadZone controlled build request ID
        required: true
        type: string
      callback_url:
        description: 🔗 Signed DeadZone build-event endpoint
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: 🛠️ Jesse Worker 1
    uses: ./.github/workflows/jesse-core.yml
    with:
      input_url: ${{ inputs.input_url }}
      build_name: ${{ inputs.build_name }}
      rom_type: ${{ inputs.rom_type }}
      compress: ${{ inputs.compress }}
      no_debloat: ${{ inputs.no_debloat }}
      avb_key: ${{ inputs.avb_key }}
      builder_name: ${{ inputs.builder_name }}
      builder_id: ${{ inputs.builder_id }}
      request_id: ${{ inputs.request_id }}
      callback_url: ${{ inputs.callback_url }}
    secrets: inherit
