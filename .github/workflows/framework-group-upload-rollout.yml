name: Enable Framework Group Uploads

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/framework-group-upload-rollout.yml'
      - 'tools/generate_framework_group_workflow.py'

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout launcher
        uses: actions/checkout@v5
        with:
          ref: main

      - name: 🧩 Generate Framework Telegram workflow
        run: python3 tools/generate_framework_group_workflow.py

      - name: ✅ Validate generated candidate
        run: |
          set -Eeuo pipefail
          test -s framework.generated.yml
          grep -q 'telegram_files:' framework.generated.yml
          grep -q 'telethon==1.44.0' framework.generated.yml
          grep -q 'Download Framework JARs from private Telegram storage' framework.generated.yml
          ! grep -q 'queue: max' framework.generated.yml

      - name: 💾 Publish generated candidate
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add framework.generated.yml
          git commit -m "build: stage Framework Telegram workflow candidate"
          git push origin HEAD:main
