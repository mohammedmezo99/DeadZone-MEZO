name: Enable Framework Group Uploads

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/framework-group-upload-rollout.yml'
      - 'tools/fix_framework_runtime_env.py'

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout launcher
        uses: actions/checkout@v5
        with:
          ref: main

      - name: 🔒 Fix Framework central runtime visibility
        run: python3 tools/fix_framework_runtime_env.py

      - name: ✅ Validate fixed candidate
        run: |
          set -Eeuo pipefail
          test -s framework.runtime-fixed.yml
          grep -q 'source runtime/bot.env' framework.runtime-fixed.yml
          grep -q 'TELEGRAM_API_HASH' framework.runtime-fixed.yml
          grep -q 'DZ_EVENT_SECRET=%s' framework.runtime-fixed.yml
          ! grep -q 'required=(DEADZONE_ENGINE_REPOSITORY' framework.runtime-fixed.yml

      - name: 💾 Publish fixed candidate
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add framework.runtime-fixed.yml
          git commit -m "build: stage Framework runtime-fixed workflow candidate"
          git push origin HEAD:main
