name: Migrate Framework Launcher to File IDs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-framework-fileid-rollout.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ github.token }}
      - run: python3 tools/migrate_framework_fileid.py
      - name: Validate Framework workflow
        run: |
          set -Eeuo pipefail
          grep -q 'Telegram file ID map' .github/workflows/framework.yml
          grep -q 'pyrofork==2.3.58' .github/workflows/framework.yml
          grep -q 'download_media(file_id.strip()' .github/workflows/framework.yml
          ! grep -q 'client.iter_dialogs' .github/workflows/framework.yml
          ! grep -q 'Invalid CLOUD_CHANNEL_ID' .github/workflows/framework.yml
          python3 -m pip install --quiet yq
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          with Path('.github/workflows/framework.yml').open(encoding='utf-8') as f:
              doc = yaml.safe_load(f)
          if not isinstance(doc, dict) or 'jobs' not in doc:
              raise SystemExit('framework.yml is not valid workflow YAML')
          PY
      - run: |
          git config user.name "Mohammed MEZO"
          git config user.email "cavo.store2026@gmail.com"
          git add .github/workflows/framework.yml
          git diff --cached --check
          git commit -m "fix: download Framework JARs from Telegram file IDs"
          git push origin HEAD:main
